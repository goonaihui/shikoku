  let dayId = found ? found.day.id : (preset && preset.dayId) || state.dayId;
  let type = base.type, booking = base.booking;
  const doneFromFor = (st) => (st !== 'done' ? '' : base.booking === 'done' ? (base.doneFrom || 'needed') : base.booking === 'confirm' ? 'confirm' : 'needed');

  const errorEl = h('p', { class: 'form-error', hidden: true });
  const fail = (msg) => { errorEl.textContent = msg; errorEl.hidden = false; };
  const title = input(base.title, 'text', { placeholder: '例如：搭機場巴士到飯店', enterkeyhint: 'done' });
  const daySel = h('select', { class: 'input' }, state.data.days.map((d, i) =>
    h('option', { value: d.id, selected: d.id === dayId }, `${dayName(i)} ${md(d.date)}（${wd(d.date)}）${d.area}`)));
  daySel.addEventListener('change', () => { dayId = daySel.value; });

  const end = input(base.end, 'time');
  const notes = h('textarea', { class: 'input', rows: '4', placeholder: '班次、票價、注意事項…' });
  notes.value = base.notes;
  const location = input(base.location, 'text', { placeholder: '景點名稱、地址，或 Google 地圖連結', autocapitalize: 'off' });
  const locationTo = input(base.locationTo, 'text', { placeholder: '車站、港口、地址，或 Google 地圖連結', autocapitalize: 'off' });
  const locLabel = h('label', { class: 'label' });
  const toField = h('div', { class: 'field' }, h('label', { class: 'label' }, '抵達地'), locationTo);
  const fillBtn = h('button', { class: 'textbtn', type: 'button' });
  const locHint = h('span', { class: 'hint' });
  const updateLocFields = () => {
    const tr = type === 'transport';
    locLabel.textContent = tr ? '出發地' : '地點';
    location.placeholder = tr ? '車站、港口、地址，或 Google 地圖連結' : '景點名稱、地址，或 Google 地圖連結';
    toField.hidden = !tr;
    fillBtn.textContent = tr ? '從標題帶入出發地和抵達地' : '用標題當地點';
    locHint.textContent = tr
      ? '標題寫成「甲地 → 乙地」的話可以直接帶入。填了兩個地點，行程上會出現這段的「路線」按鈕。'
      : '填了之後，行程上會出現「地圖」和「路線」按鈕，前後有地點的行程之間也會建議怎麼移動。';
  };
  /* "客運 縣廳通 → 大街道" → start 縣廳通, arrival 大街道 */
  const MODE_WORDS = /^(客運|巴士|公車|電車|火車|列車|渡輪|普通渡輪|高速船|高速|船|JR|搭|坐|搭乘|計程車|機場巴士|新幹線|地鐵|纜車|走路|步行)$/i;
  const cleanPlace = (t) => t.split(/\s+/).filter((w) => w && !MODE_WORDS.test(w)).join(' ');
  fillBtn.addEventListener('click', () => {
    const t = title.value.trim();
    if (type !== 'transport') { location.value = t; return; }
    const parts = t.split(/\s*(?:→|⇒|➡|->|—>|～|~)\s*/);
    if (parts.length >= 2) { location.value = cleanPlace(parts[0]); locationTo.value = cleanPlace(parts[parts.length - 1]); }
    else { locationTo.value = cleanPlace(t); }
  });
  updateLocFields();

  const itemLinks = linkRows(base.links);
  const files = attachmentPicker(base.files, fail);

  // Costs for this stop, kept as linked entries in the 花費 tab.
  const sp = splitView();
  const linked = found ? costsOf(base.id) : [];
  const costs = costRows(sp, linked);

  const collectLinks = () => itemLinks.values();
  const snapshot = () => JSON.stringify([title.value, dayId, start.value, end.value, type, booking, notes.value, location.value, locationTo.value, collectLinks(), files.signature(), costs.signature()]);
  const initial = snapshot();

  const body = h('div', null,
    errorEl,
    field('標題', title),
    field('日期', daySel),
    h('div', { class: 'row2' }, field('開始', start), field('結束（可不填）', end)),
    h('button', { class: 'textbtn clear-time', type: 'button', onclick: () => { start.value = ''; end.value = ''; } }, '清除時間（改成時間未定）'),
    field('類型', seg(TYPES, type, (v) => { type = v; updateLocFields(); })),
    field('狀態', seg(BOOKINGS, booking, (v) => { booking = v; })),
    h('div', { class: 'field' }, locLabel, location), toField,
    h('div', { class: 'field' },
      h('div', { class: 'loc-tools' }, fillBtn,
        h('button', { class: 'textbtn', type: 'button', onclick: () => {
          const a = location.value.trim(), b = type === 'transport' ? locationTo.value.trim() : '';
          const url = a && b ? legUrl(a, b) : (a || b) ? placeUrl(a || b) : '';
          if (url) window.open(url, '_blank', 'noopener');
        } }, '在地圖上確認')),
      locHint),
    field('備註', notes),
    h('div', { class: 'field' }, h('span', { class: 'label' }, '連結'), itemLinks.el,
      h('span', { class: 'hint' }, '訂房確認、Google 雲端硬碟裡的票券 PDF、地圖都可以貼。')),
    h('div', { class: 'field' }, h('span', { class: 'label' }, '附件'), files.el,
      h('span', { class: 'hint' }, '截圖、照片、PDF 票券或其他檔案都可以，一次可以選好幾個。照片會自動縮小；單一檔案上限 20 MB。')),
    h('div', { class: 'field' }, h('span', { class: 'label' }, '花費'), costs.el),
    found && found.item.updatedBy ? h('p', { class: 'meta' }, `最後由 ${found.item.updatedBy} 修改於 ${stampText(found.item.updatedAt)}`) : null,
    found ? h('button', { class: 'btn danger block', type: 'button', style: 'margin-top:18px', onclick: () => {
      if (!confirm(linked.length ? `確定刪除「${base.title}」？\n這個行程記的 ${linked.length} 筆花費也會一起刪除。` : `確定刪除「${base.title}」？`)) return;
      sheet.close(true);
      commit((d) => { M.deleteItem(base.id)(d); d.split.expenses = d.split.expenses.filter((x) => !(x.kind === 'expense' && x.itemId === base.id)); },
        `${who()}：刪除「${base.title}」`).then(() => cleanupFiles(base.files.concat(...linked.map((c) => c.files))));
    } }, '刪除這個項目') : null);

  const saveLabel = found ? '儲存修改' : '加入行程';
  const saveBtn = h('button', { class: 'btn primary', type: 'button' }, saveLabel);
  const sheet = openSheet(found ? '編輯行程' : '新增行程', body,
    [h('button', { class: 'btn ghost', type: 'button', onclick: () => sheet.close() }, '取消'), saveBtn],
    { guard: () => snapshot() === initial || confirm('還沒儲存，確定要關閉嗎？') });

  saveBtn.addEventListener('click', async () => {
    const t = title.value.trim();
    if (!t) { fail('請填標題。'); title.focus(); return; }
    const s = validTime(start.value), e = s ? validTime(end.value) : '';
    if (s && e && e < s) return fail('結束時間比開始時間早。');
    const costError = costs.validate();
    if (costError) return fail(costError);
    if (files.hasPending() && !navigator.onLine) return fail('目前沒有網路，附件無法上傳。');
    errorEl.hidden = true;
    saveBtn.disabled = true;
    let allFiles;
    try {
      allFiles = await files.upload(dayId, t, (i, n) => { saveBtn.textContent = `上傳附件 ${i}/${n}…`; });
    } catch (err) {
      fail('附件上傳失敗：' + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = saveLabel;
      return;
    }
    const item = Object.assign({}, base, {
      title: t, time: s, end: e, type, booking, doneFrom: doneFromFor(booking), notes: notes.value.replace(/\s+$/, ''), location: location.value.trim(), locationTo: type === 'transport' ? locationTo.value.trim() : '',
      links: collectLinks(), files: allFiles,
      updatedBy: who(), updatedAt: new Date().toISOString(),
    });
    const now = new Date().toISOString();
    const change = costs.changes({ itemId: base.id, dayId, type, now });
    const total = change.upserts.length ? `，花費 ${change.upserts.map((c) => money(c.amount, c.currency)).join('、')}` : '';
    sheet.close(true);
    if (state.view === 'day') state.dayId = dayId;
    await commit((d) => {
      M.upsertItem(item, dayId)(d);
      change.upserts.forEach((c) => M.upsertExpense(c)(d));
      change.deletes.forEach((id) => M.deleteExpense(id)(d));
    }, `${who()}：${found ? '修改' : '新增'}「${t}」${total}`);
    cleanupFiles(files.removed);
  });
}

/* ------------------------------------------------------------------ */
/*  Split bill                                                         */
/* ------------------------------------------------------------------ */
function money(n, cur) { return `${CUR[cur].sym}${Math.round(n).toLocaleString('en-US')}`; }
function parseAmount(v) { const n = Number(String(v || '').replace(/[,，\s¥￥$NT]/g, '')); return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; }
function personName(sp, id) { const p = sp.people.find((x) => x.id === id); return p ? p.name : '（已移除）'; }
function convert(amount, from, sp) {
  if (from === sp.currency) return amount;
  return from === 'JPY' ? amount * sp.rate : amount / sp.rate;
}
function shareText(e, sp) {
  const entries = Object.entries(e.shares).filter(([id, n]) => n > 0 && sp.people.some((p) => p.id === id));
  if (!entries.length) return '沒有分攤的人';
  const ones = entries.every(([, n]) => n === 1);
  if (ones && entries.length === sp.people.length) return sp.people.length === 2 ? '兩人平分' : '大家平分';
  if (entries.length === 1) return `只算${personName(sp, entries[0][0])}`;
  if (ones) return `${entries.map(([id]) => personName(sp, id)).join('、')} 平分`;
  return entries.map(([id, n]) => `${personName(sp, id)} ${n} 份`).join('、');
}
function dayLabel(dayId) {
  const i = state.data.days.findIndex((d) => d.id === dayId);
  if (i < 0) return '出發前／行程外';
  const d = state.data.days[i];
  return `${dayName(i)} ${md(d.date)}（${wd(d.date)}）${d.area}`;
}
function defaultExpenseDay() {
  const today = state.data.days.find((d) => d.date === todayStr());
  return today ? today.id : '';
}
function meId(sp) { const p = sp.people.find((x) => x.name === cfg.name); return p ? p.id : ''; }
/* The saved cost settings, or the default family list if nobody has set them up yet. */
function splitView() {
  const sp = state.data.split;
  return sp.people.length ? sp : Object.assign({}, sp, { people: clone(DEFAULT_PEOPLE) });
}

/* Everyone's paid total, share of costs, and the fewest payments that even things out. */
function splitSummary(sp) {
  const stat = Object.fromEntries(sp.people.map((p) => [p.id, { paid: 0, owe: 0, sent: 0, received: 0 }]));
  let total = 0;
  for (const e of sp.expenses) {
    const v = convert(e.amount, e.currency, sp);
    if (e.kind === 'transfer') {
      if (stat[e.paidBy] && stat[e.to]) { stat[e.paidBy].sent += v; stat[e.to].received += v; }
      continue;
    }
    const entries = Object.entries(e.shares).filter(([id, n]) => stat[id] && n > 0);
    const shareSum = entries.reduce((a, [, n]) => a + n, 0);
    if (!stat[e.paidBy] || !shareSum) continue;
    total += v;
    stat[e.paidBy].paid += v;
    entries.forEach(([id, n]) => { stat[id].owe += (v * n) / shareSum; });
  }
  const nets = sp.people.map((p) => { const t = stat[p.id]; return { id: p.id, name: p.name, ...t, net: t.paid + t.sent - t.owe - t.received }; });
  const creditors = nets.filter((n) => n.net >= 1).map((n) => ({ ...n, left: n.net })).sort((a, b) => b.left - a.left);
  const debtors = nets.filter((n) => n.net <= -1).map((n) => ({ ...n, left: -n.net })).sort((a, b) => b.left - a.left);
  const moves = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const x = Math.min(debtors[i].left, creditors[j].left);
    if (x >= 1) moves.push({ from: debtors[i].id, to: creditors[j].id, amount: x });
    debtors[i].left -= x; creditors[j].left -= x;
    if (debtors[i].left < 1) i++;
    if (creditors[j].left < 1) j++;
  }
  return { total, nets, moves };
}

function renderSplit() {
  const sp = splitView();
  const base = sp.currency;
  const sum = splitSummary(sp);
  // Each device picks who is using it, so "who paid" defaults to the right person.
  const whoAmI = sp.people.some((p) => p.name === cfg.name) ? null : h('div', { class: 'field who-am-i' },
    h('span', { class: 'label' }, '這台手機是'),
    seg(sp.people.map((p) => ({ id: p.name, label: p.name })), '', (name) => { cfg.name = name; saveCfg(); render(); }));

  const card = h('section', { class: 'split-card' },
    h('div', { class: 'split-total' },
      h('small', null, '總花費'),
      h('strong', null, money(sum.total, base)),
      h('div', { class: 'rate' },
        h('span', null, `1 日圓 = ${sp.rate} 台幣`),
        isAdmin() ? h('button', { class: 'textbtn', type: 'button', onclick: () => openSplitSetup() }, '設定') : null)),
    h('ul', { class: 'people' }, sum.nets.map((n) => {
      const cls = n.net >= 1 ? 'plus' : n.net <= -1 ? 'minus' : '';
      const netText = n.net >= 1 ? `應收 ${money(n.net, base)}` : n.net <= -1 ? `應付 ${money(-n.net, base)}` : '已打平';
      return h('li', null,
        h('span', { class: 'nm' }, n.name),
        h('span', { class: `net ${cls}` }, netText),
        h('span', { class: 'sub' }, `已付 ${money(n.paid, base)}　分攤 ${money(n.owe, base)}${n.sent >= 1 ? `　已給 ${money(n.sent, base)}` : ''}${n.received >= 1 ? `　已收 ${money(n.received, base)}` : ''}`));
    })),
    sum.moves.length ? h('div', { class: 'settle' },
      sum.moves.map((m) => h('div', { class: 'move' },
        h('span', { class: 'txt' }, `${personName(sp, m.from)} 給 ${personName(sp, m.to)} `, h('b', null, money(m.amount, base))),
        h('button', { class: 'btn small', type: 'button', onclick: () => openTransferSheet(null, { from: m.from, to: m.to, amount: Math.round(m.amount), currency: base }) }, '記錄已給')))) : null);

  const tools = sp.expenses.length ? h('div', { class: 'split-tools' },
    h('button', { class: 'btn small ghost', type: 'button', onclick: () => openTransferSheet(null) }, '記錄還款')) : null;

  const dayOrder = (id) => { const i = state.data.days.findIndex((d) => d.id === id); return i < 0 ? -1 : i; };
  const sorted = [...sp.expenses].sort((a, b) => dayOrder(a.dayId) - dayOrder(b.dayId) || (a.createdAt < b.createdAt ? -1 : 1));
  const groups = [];
  sorted.forEach((e) => {
    const last = groups[groups.length - 1];
    if (last && last.dayId === e.dayId) last.items.push(e); else groups.push({ dayId: e.dayId, items: [e] });
  });

  const row = (e) => {
    const open = () => (e.kind === 'transfer' ? openTransferSheet(e.id) : openExpenseSheet(e.id));
    const clip = e.files.length ? `，${e.files.length} 個附件` : '';
    return h('div', { class: `exp ${e.kind === 'transfer' ? 'transfer' : 'cat-' + e.category}`, role: 'button', tabindex: '0', onclick: open,
        onkeydown: (ev) => { if (ev.key === 'Enter') open(); } },
      h('div', { class: 'txt' },
        e.kind === 'transfer'
          ? [h('div', { class: 'ttl' }, `${personName(sp, e.paidBy)} 還給 ${personName(sp, e.to)}`), h('div', { class: 'sub' }, `${e.note || '還款'}${clip}`)]
          : [h('div', { class: 'ttl' }, e.title || itemTitleOf(e.itemId) || CATS.find((c) => c.id === e.category).label),
             h('div', { class: 'sub' }, `${personName(sp, e.paidBy)} 付，${shareText(e, sp)}${clip}`)]),
      h('div', { class: 'amt' }, h('b', null, money(e.amount, e.currency)),
        e.currency !== base ? h('small', null, `約 ${money(convert(e.amount, e.currency, sp), base)}`) : null));
  };

  main.replaceChildren(...[
    whoAmI, card, tools,
    ...groups.map((g) => [h('div', { class: 'exp-day' }, dayLabel(g.dayId)), ...g.items.map(row)]),
  ].flat().filter(Boolean));
}

function peopleSteppers(sp, shares, onChange) {
  const wrap = h('div', { class: 'share-list' });
  const amounts = new Map();
  sp.people.forEach((p) => {
    const count = h('span', null, String(shares[p.id] || 0));
    const amt = h('span', { class: 'amt' });
    amounts.set(p.id, amt);
    const set = (n) => { shares[p.id] = Math.max(0, Math.min(20, n)); count.textContent = String(shares[p.id]); onChange(); };
    wrap.append(h('div', { class: 'share-row' },
      h('span', { class: 'who' }, p.name),
      amt,
      h('div', { class: 'stepper' },
        h('button', { type: 'button', 'aria-label': `${p.name} 少一份`, onclick: () => set((shares[p.id] || 0) - 1) }, '−'),
        count,
        h('button', { type: 'button', 'aria-label': `${p.name} 多一份`, onclick: () => set((shares[p.id] || 0) + 1) }, '＋'))));
  });
  return { el: wrap, amounts, redraw: () => { sp.people.forEach((p) => { const c = wrap.querySelectorAll('.stepper span')[sp.people.indexOf(p)]; c.textContent = String(shares[p.id] || 0); }); } };
}

function daySelect(value) {
  return h('select', { class: 'input' },
    h('option', { value: '', selected: !value }, '出發前／行程外'),
    state.data.days.map((d, i) => h('option', { value: d.id, selected: d.id === value }, `${dayName(i)} ${md(d.date)}（${wd(d.date)}）${d.area}`)));
}

function openExpenseSheet(id) {
  const sp = splitView();
  const found = id ? sp.expenses.find((e) => e.id === id) : null;
  const base = found ? clone(found) : {
    id: uid(), kind: 'expense', title: '', amount: 0, currency: 'JPY', paidBy: meId(sp),
    shares: Object.fromEntries(sp.people.map((p) => [p.id, 1])), dayId: defaultExpenseDay(), category: 'food', note: '', files: [],
    createdAt: new Date().toISOString(),
  };
  let currency = base.currency, paidBy = sp.people.some((p) => p.id === base.paidBy) ? base.paidBy : meId(sp), category = base.category;
  const shares = Object.fromEntries(sp.people.map((p) => [p.id, base.shares[p.id] || 0]));

  const errorEl = h('p', { class: 'form-error', hidden: true });
  const fail = (msg) => { errorEl.textContent = msg; errorEl.hidden = false; };
  const linkedTitle = itemTitleOf(base.itemId);
  const title = input(base.title, 'text', { placeholder: linkedTitle || '例如：晚餐、JR 車票', enterkeyhint: 'next' });
  const amount = input(base.amount ? String(base.amount) : '', 'text', { inputmode: 'decimal', placeholder: '0', autocomplete: 'off' });
  const day = daySelect(base.dayId);
  const note = h('textarea', { class: 'input', rows: '2', placeholder: '可不填' });
  note.value = base.note;
  const files = attachmentPicker(base.files, fail);

  const steppers = peopleSteppers(sp, shares, () => updatePreview());
  const updatePreview = () => {
    const total = parseAmount(amount.value);
    const sum = Object.values(shares).reduce((a, n) => a + n, 0);
    sp.people.forEach((p) => {
      const n = shares[p.id] || 0;
      steppers.amounts.get(p.id).textContent = total && sum && n ? money((total * n) / sum, currency) : '—';
    });
  };
  amount.addEventListener('input', updatePreview);
  const curSeg = seg([{ id: 'JPY', label: '日圓' }, { id: 'TWD', label: '台幣' }], currency, (v) => { currency = v; updatePreview(); });
  const quick = h('div', { class: 'loc-tools' },
    h('button', { class: 'textbtn', type: 'button', onclick: () => { sp.people.forEach((p) => { shares[p.id] = 1; }); steppers.redraw(); updatePreview(); } }, '大家平分'),
    h('button', { class: 'textbtn', type: 'button', onclick: () => { sp.people.forEach((p) => { shares[p.id] = p.id === paidBy ? 1 : 0; }); steppers.redraw(); updatePreview(); } }, '只算付錢的人'));
  updatePreview();

  const snapshot = () => JSON.stringify([title.value, amount.value, currency, paidBy, shares, day.value, category, note.value, files.signature()]);
  const initial = snapshot();

  const body = h('div', null,
    errorEl,
    linkedTitle ? h('p', { class: 'linked-item' }, `來自行程「${linkedTitle}」`,
      h('button', { class: 'textbtn', type: 'button', onclick: () => { sheet.close(); if (!state.sheets.length) openEditor(base.itemId); } }, '打開行程')) : null,
    field('項目', title, linkedTitle ? '留白就用行程的標題。' : null),
    h('div', { class: 'field' }, h('label', { class: 'label' }, '金額'),
      h('div', { class: 'amount-row' }, amount, curSeg)),
    field('誰付的', seg(sp.people.map((p) => ({ id: p.id, label: p.name })), paidBy, (v) => { paidBy = v; })),
    h('div', { class: 'field' }, h('span', { class: 'label' }, '怎麼分'), steppers.el, quick,
),
    field('日期', day),
    field('類別', seg(CATS, category, (v) => { category = v; })),
    field('備註', note),
    h('div', { class: 'field' }, h('span', { class: 'label' }, '收據、附件'), files.el),
    found && found.updatedBy ? h('p', { class: 'meta' }, `最後由 ${found.updatedBy} 修改於 ${stampText(found.updatedAt)}`) : null,
    found ? h('button', { class: 'btn danger block', type: 'button', style: 'margin-top:18px', onclick: () => {
      if (!confirm(`確定刪除「${base.title || '這筆花費'}」？`)) return;
      sheet.close(true);
      commit(M.deleteExpense(base.id), `${who()}：刪除花費「${base.title}」`).then(() => cleanupFiles(base.files));
    } }, '刪除這筆') : null);

  const saveLabel = found ? '儲存修改' : '記下來';
  const saveBtn = h('button', { class: 'btn primary', type: 'button' }, saveLabel);
  const sheet = openSheet(found ? '編輯花費' : '記一筆', body,
    [h('button', { class: 'btn ghost', type: 'button', onclick: () => sheet.close() }, '取消'), saveBtn],
    { guard: () => snapshot() === initial || confirm('還沒儲存，確定要關閉嗎？') });

  saveBtn.addEventListener('click', async () => {
    const value = parseAmount(amount.value);
    if (!value) { fail('請輸入金額。'); amount.focus(); return; }
    if (!paidBy) return fail('請選誰付的。');
    if (!Object.values(shares).some((n) => n > 0)) return fail('至少要有一個人分攤。');
    if (files.hasPending() && !navigator.onLine) return fail('目前沒有網路，附件無法上傳。');
    errorEl.hidden = true;
    saveBtn.disabled = true;
    const label = title.value.trim() || linkedTitle || CATS.find((c) => c.id === category).label;
    let allFiles;
    try {
      allFiles = await files.upload('split', label, (i, n) => { saveBtn.textContent = `上傳附件 ${i}/${n}…`; });
    } catch (err) {
      fail('附件上傳失敗：' + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = saveLabel;
      return;
    }
    const exp = Object.assign({}, base, {
      title: title.value.trim(), amount: value, currency, paidBy,
      shares: Object.fromEntries(Object.entries(shares).filter(([, n]) => n > 0)),
      dayId: day.value, category, note: note.value.trim(), files: allFiles,
      updatedBy: who(), updatedAt: new Date().toISOString(),
    });
    sheet.close(true);
    await commit(M.upsertExpense(exp), `${who()}：${found ? '修改' : '記下'}花費「${label}」${money(value, currency)}`);
    cleanupFiles(files.removed);
  });
  if (!found) setTimeout(() => title.focus(), 250);
}

function openSplitSetup() {
  if (!isAdmin()) return;
  const sp = state.data.split;
  const used = (pid) => sp.expenses.some((e) => e.paidBy === pid || e.to === pid || (e.shares[pid] || 0) > 0);
  const start = splitView().people;
  let currency = sp.currency;
  const errorEl = h('p', { class: 'form-error', hidden: true });
  const list = h('div');
  const addRow = (p) => {
    const nameInput = input(p.name, 'text', { placeholder: '名字', 'aria-label': '名字' });
    nameInput.dataset.pid = p.id;
    const locked = used(p.id);
    list.append(h('div', { class: 'person-row' }, nameInput,
      h('button', { class: 'icon-btn', type: 'button', disabled: locked, title: locked ? '這個人已經有花費紀錄，不能移除' : '移除', 'aria-label': '移除', onclick: (e) => e.currentTarget.parentElement.remove() }, icon('close'))));
  };
  start.forEach(addRow);
  const rate = input(String(sp.rate), 'text', { inputmode: 'decimal' });

  const body = h('div', null,
    errorEl,
    h('div', { class: 'field' }, h('span', { class: 'label' }, '一起出錢的人'), list,
      h('button', { class: 'textbtn', type: 'button', onclick: () => addRow({ id: 'p' + uid(), name: '' }) }, '＋ 加一個人')),
    field('用哪種錢結算', seg([{ id: 'TWD', label: '台幣' }, { id: 'JPY', label: '日圓' }], currency, (v) => { currency = v; })),
    field('1 日圓 = 幾台幣', rate, '可以填你們實際換匯的匯率。'),
    h('a', { class: 'textbtn', href: 'https://www.google.com/search?q=' + encodeURIComponent('日圓 台幣 匯率'), target: '_blank', rel: 'noopener noreferrer' }, '查今天的匯率'));

  const sheet = openSheet('花費設定', body,
    [h('button', { class: 'btn ghost', type: 'button', onclick: () => sheet.close(true) }, '取消'),
     h('button', { class: 'btn primary', type: 'button', onclick: () => {
       const people = [...list.querySelectorAll('input')].map((i) => ({ id: i.dataset.pid, name: i.value.trim() })).filter((p) => p.name);
       const r = Number(rate.value.replace(/[,，\s]/g, ''));
       const fail = (m) => { errorEl.textContent = m; errorEl.hidden = false; };
       if (people.length < 2) return fail('至少要兩個人才能分攤。');
       if (new Set(people.map((p) => p.name)).size !== people.length) return fail('名字不能重複。');
       const missing = sp.people.filter((p) => used(p.id) && !people.some((x) => x.id === p.id));
       if (missing.length) return fail(`${missing.map((p) => p.name).join('、')} 已經有花費紀錄，不能移除。`);
       if (!(r > 0)) return fail('匯率要是大於 0 的數字。');
       sheet.close(true);
       commit(M.splitSettings({ people, currency, rate: Math.round(r * 10000) / 10000 }), `${who()}：更新花費設定`);
     } }, sp.people.length ? '儲存' : '開始記帳')]);
}

function usedPaths() {
  const d = state.data, used = new Set();
  const add = (list) => (list || []).forEach((f) => used.add(f.path));
  d.days.forEach((day) => { add(day.hotel.files); day.items.forEach((it) => add(it.files)); });
  d.split.expenses.forEach((e) => add(e.files));
  return used;
}
function cleanupFiles(files) {
  if (!connected() || state.queue.length) return;
  const used = usedPaths();
  files.filter((f) => f.path && !used.has(f.path)).forEach((f) => GH.remove(f.path, `${who()}：刪除附件`).catch(() => {}));
}

function openDaySheet(dayId) {
  const days = state.data.days;
  const idx = days.findIndex((d) => d.id === dayId);
  const day = days[idx];
  if (!day) return;
  // The run of consecutive nights at the same hotel (e.g. three nights in a row).
  const run = [idx];
  if (day.hotel.name) {
    for (let i = idx - 1; i >= 0 && days[i].hotel.name === day.hotel.name; i--) run.unshift(i);
    for (let i = idx + 1; i < days.length && days[i].hotel.name === day.hotel.name; i++) run.push(i);
  }
  const errorEl = h('p', { class: 'form-error', hidden: true });
  const fail = (m) => { errorEl.textContent = m; errorEl.hidden = false; };
  const area = input(day.area, 'text', { placeholder: '例如：市區' });
  const hotel = input(day.hotel.name, 'text', { placeholder: '飯店名稱' });
  const where = input(day.hotel.location, 'text', { placeholder: '地址，或 Google 地圖連結', autocapitalize: 'off' });
  const links = linkRows(day.hotel.links);
  const files = attachmentPicker(day.hotel.files, fail);
  const applyAll = h('input', { type: 'checkbox', checked: run.length > 1 });
  const values = () => JSON.stringify([area.value, hotel.value, where.value, links.values(), files.signature(), applyAll.checked]);
  const initial = values();
  const runText = run.length > 1 ? `${md(days[run[0]].date)}～${md(days[run[run.length - 1]].date)} 這 ${run.length} 晚一起更新` : '';

  const saveBtn = h('button', { class: 'btn primary', type: 'button' }, '儲存');
  const sheet = openSheet(`${dayName(idx)} ${md(day.date)}（${wd(day.date)}）`,
    h('div', null,
      errorEl,
      field('地點', area, '顯示在站名牌上。'),
      h('h3', { class: 'section-title' }, '今晚住宿'),
      field('飯店名稱', hotel),
      field('飯店地址或地圖連結', where, '用來開「路線」和估算回飯店要多久。沒填的話會用飯店名稱找。'),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '連結'), links.el,
        h('span', { class: 'hint' }, '訂房確認、飯店官網、Google 雲端硬碟都可以貼。')),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '附件'), files.el,
        h('span', { class: 'hint' }, '訂房確認截圖、收據等。')),
      run.length > 1 ? h('label', { class: 'check-line' }, applyAll, h('span', null, runText)) : null),
    [h('button', { class: 'btn ghost', type: 'button', onclick: () => sheet.close() }, '取消'), saveBtn],
    { guard: () => values() === initial || confirm('還沒儲存，確定要關閉嗎？') });

  saveBtn.addEventListener('click', async () => {
    if (files.hasPending() && !navigator.onLine) return fail('目前沒有網路，附件無法上傳。');
    saveBtn.disabled = true;
    let allFiles;
    try {
      allFiles = await files.upload('hotel', hotel.value.trim() || '住宿', (i, n) => { saveBtn.textContent = `上傳附件 ${i}/${n}…`; });
    } catch (err) {
      fail('附件上傳失敗：' + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = '儲存';
      return;
    }
    const next = { name: hotel.value.trim(), location: where.value.trim(), links: links.values(), files: allFiles };
    const ids = (applyAll.checked ? run : [idx]).map((i) => days[i].id);
    sheet.close(true);
    await commit(M.updateHotelDays(ids, dayId, area.value.trim(), next), `${who()}：修改${dayName(idx)}的地點和住宿`);
    cleanupFiles(files.removed);
  });
}

function openAdminSheet() {
  const token = input('', 'password', { placeholder: 'github_pat_…', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  const err = h('p', { class: 'form-error', hidden: true });
  const btn = h('button', { class: 'btn primary', type: 'button' }, '取得管理權限');
  const sheet = openSheet('管理員登入', h('div', null,
      h('p', { class: 'lead' }, '輸入管理員的 GitHub token，這台裝置就能使用設定。'),
      err, field('Token', token)),
    [h('button', { class: 'btn ghost', type: 'button', onclick: () => sheet.close(true) }, '取消'), btn]);
  btn.addEventListener('click', async () => {
    const t = token.value.trim();
    const fail = (m) => { err.textContent = m; err.hidden = false; };
    if (!t) return fail('請貼上 token。');
    btn.disabled = true;
    const code = await probeToken(Object.assign({}, cfg, { token: t }));
    btn.disabled = false;
    if (code === 0) return fail('連不上 GitHub，請檢查網路。');
    if (code !== 200) return fail(code === 401 ? '這個 token 無效或已過期。' : '這個 token 打不開行程資料。');
    cfg.token = t;
    cfg.role = 'admin';
    saveCfg();
    sheet.close(true);
    render();
    toast('這台裝置現在可以使用設定');
  });
  setTimeout(() => token.focus(), 250);
}

    const next = { name: name.value.trim(), owner: owner.value.trim(), repo: repo.value.trim(), branch: branch.value.trim() || 'main', path: path.value.trim() || 'data.json', token: token.value.trim() || cfg.token };

  });

        h('p', { class: 'hint' }, '拿到這個連結的人都能看和改行程，請只用私訊傳。她設定好之後，可以把訊息收回。')].filter(Boolean));
      inviteStatus.el.hidden = true;

    h('p', { class: 'lead' }, '產生一個連結傳給對方，她點開、確認名字就能用，不需要 GitHub 帳號。登入一次之後，下次打開就直接進入。'),
    h('div', { class: 'field' }, h('span', { class: 'label' }, '連結給誰用'), inviteFor, inviteHint),
    field('名字', inviteName), nameChips,
    h('details', { class: 'advanced' }, h('summary', null, '另外給她一個 token（可以單獨停用）'),
      field('她專用的 token', inviteToken, '不填的話，連結會使用你目前的 token。')),
    h('div', { class: 'stack' }, inviteBtn, inviteStatus.el, inviteOut),
    h('h3', { class: 'section-title' }, '帳號'),
    field('你的名字', name, '修改紀錄會顯示這個名字。'),
    field('GitHub 帳號', owner),
    field('資料 repo', repo),
    h('div', { class: 'row2' }, field('分支', branch), field('檔案', path)),
    field('更換 Token', token),
    saveBtn, status,
    h('h3', { class: 'section-title' }, '其他'),
    h('div', { class: 'stack' },
      h('a', { class: 'btn ghost', href: `https://github.com/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/commits/${encodeURIComponent(cfg.branch)}`, target: '_blank', rel: 'noopener noreferrer' }, '在 GitHub 看修改紀錄'),
      exportBtn,
      geoBtn,
      h('p', { class: 'hint' }, '移動時間估算會把「地點」欄位的名稱送到 OpenStreetMap 查座標，只查一次，結果存在這台裝置。'),
      h('button', { class: 'btn danger', type: 'button', onclick: () => {
        const warn = state.queue.length ? `還有 ${state.queue.length} 項修改沒存到 GitHub，登出會遺失。\n` : '';
        if (confirm(`${warn}要在這台裝置登出嗎？會清除 token 和離線資料，GitHub 上的行程不受影響。`)) signOut();
      } }, '在這台裝置登出'))));
}

/* ------------------------------------------------------------------ */
/*  Wiring                                                             */
/* ------------------------------------------------------------------ */
$('settingsBtn').append(icon('gear'));

$('settingsBtn').addEventListener('click', openSettings);
$('addBtn').addEventListener('click', () => { if (state.view === 'split') openExpenseSheet(null); else if (state.view === 'prep') openPrepSheet(null); else openEditor(null); });
$('syncBtn').addEventListener('click', () => { if (state.queue.length) flush(); else pull(); });
document.querySelectorAll('.views button').forEach((b) => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  render();
  b.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  window.scrollTo({ top: 0 });
}));

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.sheets.length) { state.sheets[state.sheets.length - 1].close(); return; }
  if (state.sheets.length || state.view !== 'day' || !state.data || !connected() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') goDay(currentIndex() - 1);
  if (e.key === 'ArrowRight') goDay(currentIndex() + 1);
});

let touchStart = null;
main.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStart = e.touches.length === 1 && !e.target.closest('.strip, .thumbs, .links') ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
}, { passive: true });
main.addEventListener('touchend', (e) => {
  if (!touchStart || state.view !== 'day' || !state.data || !connected()) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - touchStart.at < 600) goDay(currentIndex() + (dx < 0 ? 1 : -1));
  touchStart = null;
}, { passive: true });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (connected()) { if (state.queue.length) flush(); else pull({ quiet: true }); }
});
window.addEventListener('online', () => { if (connected()) { if (state.queue.length) flush(); else pull({ quiet: true }); } });
window.addEventListener('beforeunload', (e) => { if (state.queue.length) { e.preventDefault(); e.returnValue = ''; } });
setInterval(() => {
  if (!connected() || document.visibilityState !== 'visible') return;
  if (state.queue.length) { if (navigator.onLine) flush(); return; }
  if (!state.sheets.length && Date.now() - state.lastPull > 45000) pull({ quiet: true });
}, 15000);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* Start. Visiting the site with #admin opens the admin login. */
const wantsAdmin = location.hash === '#admin';
if (wantsAdmin) history.replaceState(null, '', location.pathname + location.search);
var openTokenLogin = wantsAdmin && !connected();
if (connected()) {
  try {
    const cached = JSON.parse(store.get(cacheKey()) || 'null');
    if (cached) { state.remote = normalize(cached); state.data = clone(state.remote); }
  } catch {}
  render();
  setSync('saving', '同步中…');
  pull({ quiet: Boolean(state.data) });
  if (wantsAdmin) { if (isAdmin()) openSettings(); else openAdminSheet(); }
} else {
  render();
}
/* Same page, new #admin or invite link pasted into the address bar. */
window.addEventListener('hashchange', () => {
  if (location.hash === '#admin') {
    history.replaceState(null, '', location.pathname + location.search);
    if (!connected()) { openTokenLogin = true; render(); } else if (isAdmin()) openSettings(); else openAdminSheet();
  } else if (/join=/.test(location.hash)) {
    const inv = parseInvite(location.hash);
    if (!IN_APP) clearInviteFromUrl();
    if (inv && !connected()) { pendingInvite = inv; render(); }
  }
});

})();
</script>
</body>
</html>
