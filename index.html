<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EEED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行程">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>旅行行程</title>
<style>
:root{
  --bg:#E8EEED; --panel:#FFFFFF; --ink:#17293B; --ink-2:#4F6172; --ink-3:#7F909C; --line:#C9D5D6;
  --sea:#1F4E7A; --sea-deep:#163A5C;
  --mikan:#C9660A; --olive:#4F7424; --olive-soft:#E3ECD5; --red:#A8322B; --grape:#6A56A8;
  --t-transport:#6FA56B; --t-transport-bg:#EAF3E6;
  --t-sight:#DB955A;     --t-sight-bg:#FBEDE1;
  --t-meal:#8B79C6;      --t-meal-bg:#EDE9F7;
  --t-stay:#5B8CBE;      --t-stay-bg:#E3EDF7;
  --t-shop:#C27BA0;      --t-shop-bg:#F7E9F1;
  --t-other:#98A6A9;     --t-other-bg:#F2F5F5;
  --font:-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Hiragino Sans", "Microsoft JhengHei", sans-serif;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body.signed-out .views, body.signed-out #syncBtn, body.signed-out #settingsBtn, body.signed-out .fab{display:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:var(--safe-t)}
.topbar-inner{display:flex;align-items:center;gap:8px;min-height:54px}
.app-title{flex:1;margin:0;font-size:18px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink-2);min-height:34px;max-width:52vw}
.sync span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.sync[data-kind=ok] .dot{background:var(--olive)}
.sync[data-kind=saving] .dot{background:var(--sea)}
.sync[data-kind=pending] .dot{background:var(--mikan)}
.sync[data-kind=error] .dot{background:var(--red)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--ink)}
.views{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{flex:0 0 auto;border:0;background:none;padding:8px 0 9px;font-size:15px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.views button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--mikan);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
main{padding-top:12px;padding-bottom:calc(110px + var(--safe-b))}

/* Station-name-board motif (day header, login, lock) */
.sign{border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.sign-face{display:block;width:100%;border:0;background:none;padding:16px 16px 12px;text-align:center}
.sign-area{font-size:clamp(28px, 9vw, 40px);font-weight:800;letter-spacing:.1em;line-height:1.15;overflow-wrap:anywhere}
.sign-area.empty{color:var(--ink-3);font-weight:600;font-size:22px;letter-spacing:.02em}
.sign-day{margin-top:6px;color:var(--ink-2);font-size:15px;font-variant-numeric:tabular-nums}
.sign-band{display:flex;justify-content:space-between;align-items:stretch;background:var(--sea);color:#fff;border-top:3px solid var(--sea-deep);min-height:46px}
.sign-band button{flex:1 1 50%;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;color:#fff;padding:9px 14px;font-size:14px;text-align:left}
.sign-band button.next{justify-content:flex-end;text-align:right}
.sign-band button:disabled{visibility:hidden}
.sign-band .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign-band .arr{font-size:12px;opacity:.85}
.sign-band .band-text{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;padding:8px 14px;text-align:center}

.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.chip-day{position:relative;flex:0 0 auto;min-width:50px;padding:6px 4px 5px;border:1px solid var(--line);background:var(--panel);border-radius:8px;text-align:center;line-height:1.2}
.chip-day .d{display:block;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip-day .w{display:block;font-size:12px;color:var(--ink-2)}
.chip-day[aria-current=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-day[aria-current=true] .w{color:#C9D4DE}
.chip-day .flag{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--mikan)}
.chip-day .flag.confirm{background:var(--grape)}
.count.confirm{background:var(--grape)}
.todo-row.confirm{border-left-color:var(--grape)}

.stay{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--t-stay-bg);border-radius:8px;padding:10px 12px;margin-bottom:14px;min-height:48px;cursor:pointer}
.stay .stay-text{flex:1;min-width:0}
.stay > svg{margin-top:8px;flex:0 0 auto}
.stay .actions{margin-top:4px}
.stay .links{margin-top:6px}
.stay small{display:block;color:var(--ink-2);font-size:12px}
.stay strong{display:block;font-weight:600;overflow-wrap:anywhere}
.stay .open{flex:0 0 auto;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--sea)}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:54px 1fr;gap:10px;margin-bottom:8px}
.t{text-align:right;padding-top:9px;font-variant-numeric:tabular-nums;line-height:1.25}
.t-start{display:block;font-weight:700;font-size:16px}
.t-end{display:block;font-size:13px;color:var(--ink-3)}
.t-none{display:block;font-size:12px;color:var(--ink-3)}
.body{display:block;width:100%;text-align:left;border-left:4px solid var(--t-other);background:var(--t-other-bg);border-radius:8px;padding:9px 12px 10px;cursor:pointer}
.type-transport .body{border-left-color:var(--t-transport);background:var(--t-transport-bg)}
.type-sight .body{border-left-color:var(--t-sight);background:var(--t-sight-bg)}
.type-meal .body{border-left-color:var(--t-meal);background:var(--t-meal-bg)}
.type-stay .body{border-left-color:var(--t-stay);background:var(--t-stay-bg)}
.item-title{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.badge{font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;line-height:20px}
.badge.need{background:var(--mikan);color:#fff}
.badge.done{background:var(--olive-soft);color:var(--olive)}
.badge.confirm{background:var(--grape);color:#fff}
.badge.cost{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.cost-box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.cost-box .field{margin-bottom:10px}
.cost-box details.advanced{margin:0}
.cost-box .share-list{margin-top:6px}
.linked-item{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;color:var(--ink-2)}
.notes{margin:5px 0 0;font-size:14px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.link-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-height:34px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--sea);text-decoration:none}
.link-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:0 0 auto;width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.broken::after{content:"無法載入";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3)}
.meta{margin-top:6px;font-size:12px;color:var(--ink-3)}
.link-chip.place{color:var(--ink);background:var(--panel)}
.link-chip.route{background:var(--sea);border-color:var(--sea);color:#fff}
.leg-arrow{align-self:center;color:var(--ink-3);font-size:14px}
.places li{flex-wrap:wrap}
.places .btns{display:flex;gap:6px;flex:0 0 auto}
.stay .actions{display:flex;gap:6px;flex:0 0 auto}
.loc-tools{display:flex;gap:16px;margin-top:2px}
.trip-map{position:relative;isolation:isolate;height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:320px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#E9EFEC}
.trip-map.picking{cursor:crosshair;outline:3px solid var(--mikan);outline-offset:-3px}
.map-note{position:absolute;left:10px;right:10px;bottom:10px;z-index:1000;background:rgba(255,255,255,.95);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink-2);box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none}
.map-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 14px}
.map-bar .spacer{flex:1}
.pin-wrap{background:none;border:0}
.pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--t-other);color:#fff;font:700 14px/1 var(--font);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.t-transport{background:var(--t-transport)}
.pin.t-sight{background:var(--t-sight)}
.pin.t-meal{background:var(--t-meal)}
.pin.t-stay,.pin.hotel{background:var(--t-stay)}
.pin.hotel{border-radius:8px}
.pin.arrival{background:#fff;color:var(--t-transport);border-color:var(--t-transport)}
.pin.day{background:var(--sea)}
.popup{min-width:180px;font-family:var(--font)}
.popup b{display:block;font-size:15px;color:var(--ink)}
.popup small{display:block;color:var(--ink-2);margin:2px 0 8px;font-size:12px}
.popup .row{display:flex;gap:6px}
.popup a.btn{color:#fff}
.popup a.btn.ghost{color:var(--ink)}
.leaflet-container{font-family:var(--font)}
.places .num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;background:var(--t-other)}
.places .num.t-transport{background:var(--t-transport)}
.places .num.t-sight{background:var(--t-sight)}
.places .num.t-meal{background:var(--t-meal)}
.places .num.t-stay,.places .num.hotel{background:var(--t-stay)}
.places .num.hotel{border-radius:6px}
.places li .txt{cursor:pointer}
.todo-section{display:flex;align-items:center;gap:8px;font-size:17px;margin:18px 0 4px}
.todo-section:first-of-type{margin-top:4px}
.todo-row .tag{font-size:12px;color:var(--ink-3);margin-left:6px}
.map-frame{display:block;width:100%;height:calc(100vh - 300px);height:calc(100dvh - 300px);min-height:340px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.map-actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.places{list-style:none;margin:0;padding:0}
.places li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px;margin-bottom:6px}
.places .txt{flex:1;min-width:0}
.places .txt div{font-weight:600;overflow-wrap:anywhere}
.places .txt small{display:block;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section-head{font-size:15px;margin:0 0 8px}
.pdf-pages{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 0 20px}
.pdf-pages canvas{display:block;max-width:100%;height:auto;background:#fff}
.viewer-note{color:#fff;text-align:center;padding:40px 20px;font-size:15px}
.viewer-note b{display:block;font-size:28px;margin-bottom:8px}
.empty-day{padding:28px 16px;text-align:center;color:var(--ink-2);background:var(--panel);border-radius:8px;border:1px dashed var(--line)}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px;color:var(--ink-2)}
.notice p{margin:0;flex:1 1 220px}
.notice.error{border-left-color:var(--red)}

/* Travel between stops */
.hop{display:grid;grid-template-columns:54px 1fr;gap:10px;margin:-4px 0 4px}
.hop-body{display:flex;align-items:center;gap:10px;margin-left:1px;padding:4px 0 4px 13px;border-left:2px dashed var(--ink-3);min-height:42px}
.hop-text{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.4}
.hop-text b{color:var(--ink);font-weight:600}
.hop-text .from{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hop-warn{display:block;color:var(--mikan);font-weight:700}
.hop-go{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--sea);font-size:13px;text-decoration:none}

/* Before the trip */
.prep-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:6px}
.prep-card strong{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.prep-card small{color:var(--ink-2);font-size:13px}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--olive);border-radius:999px}
.prep-row{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 8px;margin-bottom:6px}
.check{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:transparent;font-size:20px;font-weight:800}
.check[aria-pressed=true]{background:var(--olive);border-color:var(--olive);color:#fff}
.check.tally{color:var(--ink-2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;cursor:default}
.check.tally[aria-pressed=true]{color:#fff;font-size:20px}
.who-ticks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.who-ticks button{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink)}
.who-ticks button::before{content:"";width:14px;height:14px;border-radius:4px;border:2px solid var(--line);box-sizing:border-box}
.who-ticks button[aria-pressed=true]{background:var(--olive);border-color:var(--olive);color:#fff}
.who-ticks button[aria-pressed=true]::before{content:"✓";border:0;width:auto;height:auto;font-size:13px;line-height:1}
.who-ticks button.me{box-shadow:0 0 0 2px var(--sea) inset}
.prep-row .txt{flex:1;min-width:0;padding-top:8px;cursor:pointer}
.prep-row .ttl{font-weight:600;overflow-wrap:anywhere}
.prep-row.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.prep-row .notes{margin-top:2px}
.prep-sub{display:flex;align-items:center;gap:8px;margin:12px 0 6px 2px}
.prep-sub .sub-name{border:0;background:none;padding:2px 0;font-size:15px;font-weight:700;color:var(--ink);min-height:30px}
.prep-sub .sub-count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prep-sub .textbtn{margin-left:auto;min-height:30px;padding:2px 0}
.prep-row.nested{margin-left:14px}
.add-sub{display:block;margin:4px 0 0 14px}
.sub-row{display:grid;grid-template-columns:1fr 40px 40px 40px;gap:4px;margin-bottom:6px}
.sub-row .icon-btn{width:40px;height:46px;color:var(--ink-2);font-size:18px}
.owner{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--sea);background:var(--t-stay-bg);border-radius:4px;padding:1px 7px}
.who-am-i{margin-bottom:12px}

/* Split bill */
.split-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.split-total{padding:14px 16px 10px}
.split-total small{display:block;color:var(--ink-2);font-size:13px}
.split-total strong{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.2}
.split-total .rate{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--ink-2)}
.split-total .rate .textbtn{min-height:28px;padding:2px 0}
.people{list-style:none;margin:0;padding:0 16px}
.people li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.people .nm{font-weight:700}
.people .net{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.people .net.plus{color:var(--olive)}
.people .net.minus{color:var(--mikan)}
.people .sub{grid-column:1 / -1;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.settle{background:var(--sea);color:#fff;padding:10px 16px 12px;border-top:3px solid var(--sea-deep)}
.settle p{margin:0 0 6px;font-size:13px;opacity:.85}
.move{display:flex;align-items:center;gap:10px;padding:6px 0}
.move .txt{flex:1;min-width:0;font-size:15px}
.move .txt b{font-variant-numeric:tabular-nums}
.move .btn{background:#fff;color:var(--sea);border:0}
.split-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.exp-day{font-size:13px;color:var(--ink-2);margin:16px 0 6px;font-weight:600}
.exp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--t-other);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.exp.cat-transport{border-left-color:var(--t-transport)}
.exp.cat-stay{border-left-color:var(--t-stay)}
.exp.cat-food{border-left-color:var(--t-meal)}
.exp.cat-ticket{border-left-color:var(--t-sight)}
.exp.cat-shop{border-left-color:var(--t-shop)}
.exp.transfer{border-left-color:var(--sea);background:var(--t-stay-bg)}
.exp .txt{flex:1;min-width:0}
.exp .ttl{font-weight:600;overflow-wrap:anywhere}
.exp .sub{font-size:13px;color:var(--ink-2)}
.exp .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp .amt b{display:block;font-size:16px}
.exp .amt small{display:block;font-size:12px;color:var(--ink-3)}
.amount-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.share-list{border:1px solid var(--line);border-radius:8px;padding:2px 12px;background:#fff}
.share-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.share-row:first-child{border-top:0}
.share-row .who{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share-row .amt{min-width:76px;text-align:right;color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.stepper button{width:38px;height:36px;border:0;background:#fff;font-size:18px;line-height:1}
.stepper span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.person-row{display:grid;grid-template-columns:1fr 40px;gap:6px;margin-bottom:6px}
.person-row .icon-btn{width:40px;height:46px;color:var(--ink-3)}
.person-row .icon-btn:disabled{opacity:.3}

/* Booking view */
.todo-head{font-size:20px;margin:4px 0 12px}
.todo-day{font-size:13px;color:var(--ink-2);margin:16px 0 6px;font-weight:600}
.todo-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mikan);border-radius:8px;padding:10px 10px 10px 12px;margin-bottom:6px;cursor:pointer}
.todo-row.done{border-left-color:var(--olive);opacity:.8}
.todo-row .txt{flex:1;min-width:0}
.todo-row .sub{font-size:13px;color:var(--ink-2)}
.todo-row .item-title{font-size:15px}

/* Login */
.login-body{padding:16px 16px 18px}
.login-body > p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
details.advanced{margin:-4px 0 14px}
details.advanced summary{cursor:pointer;color:var(--sea);font-size:14px;padding:6px 0;min-height:34px}
details.advanced[open] summary{margin-bottom:8px}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;min-height:46px;font-weight:600;text-decoration:none}
.btn.primary{background:var(--sea);color:#fff}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--panel);border:1px solid #E6C3BF;color:var(--red)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.fab{position:fixed;z-index:15;right:max(16px, calc((100vw - 640px) / 2 + 16px));bottom:calc(18px + var(--safe-b));display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--sea);color:#fff;font-weight:700;padding:12px 20px 12px 16px;min-height:50px;box-shadow:0 6px 18px rgba(22,58,92,.3)}
.fab[hidden]{display:none}

.field{margin-bottom:14px}
.label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:600}
.hint{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.lead{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
.input{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-height:46px;-webkit-appearance:none;appearance:none}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.input:focus{outline:2px solid var(--sea);outline-offset:0;border-color:var(--sea)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;min-height:38px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.textbtn{border:0;background:none;color:var(--sea);padding:6px 0;font-size:14px;min-height:34px}
.textbtn.clear-time{margin:-8px 0 12px}
.check-line{display:flex;align-items:center;gap:10px;margin:4px 0 6px;font-size:15px}
.check-line input{width:22px;height:22px;accent-color:var(--sea)}
.link-row{display:grid;grid-template-columns:1fr 1.4fr 40px;gap:6px;margin-bottom:6px}
.link-row .icon-btn{width:40px;height:46px;color:var(--ink-3)}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file-tile{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.file-tile img{width:100%;height:100%;object-fit:cover;display:block}
.file-tile .x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(23,41,59,.78);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.file-tile .x svg{width:14px;height:14px}
.file-tile .doc, .thumb .doc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;background:var(--t-stay-bg);color:var(--ink)}
.doc b{font-size:13px;letter-spacing:.04em}
.doc small{font-size:10px;line-height:1.2;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-open{position:absolute;inset:0;border:0;padding:0;background:none;display:block}
.file-tile.new::after{content:"未上傳";position:absolute;left:0;right:0;bottom:0;font-size:11px;text-align:center;background:rgba(201,102,10,.9);color:#fff;line-height:18px}
.add-file{position:relative;width:76px;height:76px;border-radius:8px;border:1px dashed var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2);background:#fff;cursor:pointer}
.add-file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.form-error{color:var(--red);font-size:14px;margin:0 0 10px}
.login-body .textbtn{display:block;margin:12px auto 0}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.section-title{font-size:15px;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.section-title:first-child{margin-top:0;padding-top:0;border-top:0}
.stack{display:flex;flex-direction:column;gap:8px}
.status-line{font-size:14px;color:var(--ink-2);margin:8px 0 0}
.status-line.err{color:var(--red)}

/* Sheets */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(15,30,45,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;background:var(--panel);border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:rise .22s ease-out}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 16px;border-bottom:1px solid var(--line)}
.sheet-title{flex:1;margin:0;font-size:17px}
.sheet-body{overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;padding:10px 16px calc(10px + var(--safe-b));border-top:1px solid var(--line)}
.sheet-foot .btn.primary{flex:1}
@media (min-width:700px){
  .backdrop{align-items:center;padding:24px}
  .sheet{border-radius:14px;max-height:86vh}
  .sheet-foot{padding-bottom:12px}
}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(8,16,24,.95);display:flex;flex-direction:column;animation:fade .15s ease-out}
.viewer-bar{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 8px 6px 14px;color:#fff}
.viewer-bar .name{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.viewer-bar .icon-btn{color:#fff}
.viewer-bar a{color:#fff;font-size:14px;padding:8px 10px}
.viewer-img{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding-bottom:var(--safe-b)}
.viewer-img img{max-width:100%;height:auto;display:block}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body class="signed-out">
<header class="topbar">
  <div class="wrap">
    <div class="topbar-inner">
      <h1 class="app-title" id="tripTitle">旅行行程</h1>
      <button class="sync" id="syncBtn" type="button" data-kind="saving"><span class="dot"></span><span id="syncText">同步中…</span></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定"></button>
    </div>
    <div class="views" role="tablist">
      <button type="button" role="tab" data-view="day" aria-selected="true">每日行程</button>
      <button type="button" role="tab" data-view="prep" aria-selected="false">行前注意事項</button>
      <button type="button" role="tab" data-view="todo" aria-selected="false">待辦<span class="count" id="todoCount" hidden></span></button>
      <button type="button" role="tab" data-view="map" aria-selected="false">地圖</button>
      <button type="button" role="tab" data-view="split" aria-selected="false">花費</button>
    </div>
  </div>
</header>
<main class="wrap" id="main"></main>
<button class="fab" id="addBtn" type="button" hidden></button>

<script>
'use strict';
(() => {
/* This file contains no trip data. The itinerary lives in data.json in a

/* ------------------------------------------------------------------ */
/*  Constants and small helpers                                        */
/* ------------------------------------------------------------------ */
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

const TYPES = [
  { id: 'transport', label: '交通' }, { id: 'sight', label: '景點' }, { id: 'meal', label: '用餐' },

const BOOKINGS = [{ id: '', label: '無' }, { id: 'needed', label: '待處理' }, { id: 'confirm', label: '待確認' }, { id: 'done', label: '已完成' }];
const ICONS = {

  image: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>',
  pin: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  route: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>',
};
function icon(name) { const t = document.createElement('template'); t.innerHTML = ICONS[name]; return t.content.firstChild; }

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = (id) => document.getElementById(id);
const clone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const validTime = (t) => (/^\d{2}:\d{2}$/.test(t || '') ? t : '');
function parseDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function md(s) { const d = parseDate(s); return d ? `${d.getMonth() + 1}/${d.getDate()}` : ''; }
function wd(s) { const d = parseDate(s); return d ? WEEK[d.getDay()] : ''; }
function dayName(i) { return `第${NUM[i] || i + 1}天`; }
function pad(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function stampText(iso) { const d = new Date(iso || ''); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function safeUrl(u) {
  let s = String(u || '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return x.protocol === 'http:' || x.protocol === 'https:' ? x.href : ''; } catch { return ''; }
}
function linkLabel(l) {
  if (l.label) return l.label;
  try {
    const host = new URL(l.url).hostname.replace(/^www\./, '');
    return /(^|\.)(drive|docs)\.google\.com$/.test(host) ? 'Google 雲端硬碟' : host;
  } catch { return l.url; }
}

const store = (() => {
  const mem = {};
  return {
    get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch {} return k in mem ? mem[k] : null; },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch {} },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch {} },
  };
})();

function utf8ToB64(str) { return bytesToB64(new TextEncoder().encode(str)); }
function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBytes(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
const b64ToUtf8 = (b64) => new TextDecoder().decode(b64ToBytes(b64));

/* ------------------------------------------------------------------ */
/*  Data model                                                         */
/* ------------------------------------------------------------------ */
function normalizeFiles(list) {
  return (Array.isArray(list) ? list : []).filter((f) => f && f.path).map((f) => ({ path: String(f.path), name: String(f.name || ''), type: String(f.type || ''), size: Number(f.size) || 0 }));
}
function normalizeLinks(list) {
  return (Array.isArray(list) ? list : []).filter((l) => l && safeUrl(l.url)).map((l) => ({ label: String(l.label || ''), url: safeUrl(l.url) }));
}
function normalizeHotel(raw) {
  const x = raw && typeof raw === 'object' ? raw : {};
  const links = normalizeLinks(x.links);
  if (!links.length && x.url && safeUrl(x.url)) links.push({ label: '', url: safeUrl(x.url) }); // older single-link format
  return { name: String(x.name || ''), location: String(x.location || ''), links, files: normalizeFiles(x.files) };
}
const PREP_SECTIONS = ['證件', '網路與手機', '錢', '行李', '預約', '其他'];
const LUGGAGE_SUBS = ['衣物', '盥洗用品', '電子產品', '藥品'];
const SUGGESTED_SUB = { '常用藥品': '藥品', '好走的鞋': '衣物', '行動電源放隨身行李': '電子產品', '充電器': '電子產品' };
function normalizePrep(raw) {
  const x = raw && typeof raw === 'object' ? raw : {};
  return {
    items: (Array.isArray(x.items) ? x.items : []).map((it, i) => ({
      id: String(it.id || uid()),
      order: Number.isFinite(it.order) ? it.order : i,
      section: PREP_SECTIONS.includes(it.section) ? it.section : '其他',
      sub: it.section === '行李' ? (typeof it.sub === 'string' ? it.sub : SUGGESTED_SUB[it.text] || '') : '', // older items had no sub
      text: String(it.text || ''),
      detail: String(it.detail || ''),
      owner: String(it.owner || ''),
      doneBy: it.owner === '*' && Array.isArray(it.doneBy) ? [...new Set(it.doneBy.map(String))] : [],
      done: Boolean(it.done),
      updatedBy: String(it.updatedBy || ''), updatedAt: String(it.updatedAt || ''),
    })),
    subs: Array.isArray(x.subs) ? [...new Set(x.subs.map((v) => String(v).trim()).filter(Boolean))] : null,
  };
}
/* 行李 subcategories in display order: the managed list (or the defaults), plus any name still used by an item. */
function luggageSubList(prep) {
  const base = Array.isArray(prep.subs) ? prep.subs : LUGGAGE_SUBS;
  const extra = [];
  prep.items.forEach((x) => { if (x.section === '行李' && x.sub && !base.includes(x.sub) && !extra.includes(x.sub)) extra.push(x.sub); });
  return [...base, ...extra];
}
function normalizeSplit(raw) {
  const sp = raw && typeof raw === 'object' ? raw : {};
  const people = (Array.isArray(sp.people) ? sp.people : []).filter((p) => p && p.id && p.name).map((p) => ({ id: String(p.id), name: String(p.name) }));
  return {
    people,
    currency: sp.currency === 'JPY' ? 'JPY' : 'TWD',
    rate: Number(sp.rate) > 0 ? Number(sp.rate) : DEFAULT_RATE,
    expenses: (Array.isArray(sp.expenses) ? sp.expenses : []).map((e) => ({
      id: String(e.id || uid()),
      kind: e.kind === 'transfer' ? 'transfer' : 'expense',
      title: String(e.title || ''),
      amount: Math.max(0, Math.round((Number(e.amount) || 0) * 100) / 100),
      currency: e.currency === 'TWD' ? 'TWD' : 'JPY',
      paidBy: String(e.paidBy || ''),
      to: String(e.to || ''),
      shares: Object.fromEntries(Object.entries(e.shares && typeof e.shares === 'object' ? e.shares : {})

/* Each change is a small function, so it can be re-applied on top of whatever

  upsertItem: (item, dayId) => (d) => {
    d.days.forEach((day) => { day.items = day.items.filter((x) => x.id !== item.id); });

    if (day) day.items.push(clone(item));
  },
  deleteItem: (id) => (d) => { d.days.forEach((day) => { day.items = day.items.filter((x) => x.id !== id); }); },

  },
  setMap: (url) => (d) => { d.mapUrl = url; },
  updateHotelDays: (dayIds, areaDayId, area, hotel) => (d) => {

  },
  upsertPrep: (item) => (d) => {
    d.prep = normalizePrep(d.prep);

  addPrep: (items) => (d) => {

  },
  /* For items everyone is responsible for: tick or untick one person; done once all have ticked. */
  togglePrepPerson: (id, personId, by, at) => (d) => {
    d.prep = normalizePrep(d.prep);

/* ------------------------------------------------------------------ */
/*  GitHub contents API                                                */
/* ------------------------------------------------------------------ */
const GH = {
  repoUrl() { return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`; },
  url(path) { return this.repoUrl() + '/contents/' + path.split('/').map(encodeURIComponent).join('/'); },
  headers(raw) {
    return {
      Authorization: `Bearer ${cfg.token}`,
      Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };
  },
  async send(url, init) {
    try { return await fetch(url, Object.assign({ cache: 'no-store' }, init)); } catch {
      const e = new Error('連不上 GitHub，請檢查網路。');
      e.network = true;
      throw e;
    }
  },
  async req(method, path, { body, raw, ref } = {}) {
    const url = this.url(path) + (ref ? '?ref=' + encodeURIComponent(cfg.branch) : '');
    const headers = this.headers(raw);
    if (body) headers['Content-Type'] = 'application/json';
    return this.send(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  },
  async error(res) {
    let msg = '';
    try { msg = (await res.json()).message || ''; } catch {}
    let text;
    if (res.status === 401) text = 'Token 無效或已過期。';
    else if (res.status === 403) text = /rate limit/i.test(msg) ? 'GitHub 請求次數暫時用完，請稍後再試。' : '這個 token 沒有 repo 的寫入權限。';
    else if (res.status === 404) text = '找不到 repo。請檢查帳號、repo 名稱，以及 token 是否有權限。';
    else if (res.status === 409) text = '資料剛被別人修改。';
    else if (res.status === 422 && /branch/i.test(msg)) text = `找不到分支「${cfg.branch}」。`;
    else text = `GitHub 回傳錯誤 ${res.status}${msg ? '：' + msg : ''}`;
    const e = new Error(text);
    e.status = res.status; e.ghMessage = msg;
    return e;
  },
  async readJSON(path) {
    const res = await this.req('GET', path, { ref: true });
    if (res.status === 404) {
      const repoRes = await this.send(this.repoUrl(), { headers: this.headers() });
      if (repoRes.ok) return null; // repo reachable, file missing
      throw await this.error(repoRes);
    }
    if (!res.ok) throw await this.error(res);
    const meta = await res.json();
    let text;
    if (meta.encoding === 'base64' && meta.content) text = b64ToUtf8(meta.content);
    else {
      const rawRes = await this.req('GET', path, { ref: true, raw: true });
      if (!rawRes.ok) throw await this.error(rawRes);
      text = await rawRes.text();
    }
    try { return { data: JSON.parse(text), sha: meta.sha }; } catch {
      throw new Error(`${path} 不是有效的 JSON，請到 GitHub 檢查這個檔案。`);
    }
  },
  async write(path, base64, message, sha) {
    const body = { message, content: base64, branch: cfg.branch };
    if (sha) body.sha = sha;
    const res = await this.req('PUT', path, { body });
    if (!res.ok) throw await this.error(res);
    return (await res.json()).content.sha;
  },
  async writeNew(path, base64, message) {
    for (let attempt = 0; ; attempt++) {
      try { return await this.write(path, base64, message); } catch (e) {
        if (e.status === 409 && attempt < 4) { await sleep(500 * (attempt + 1)); continue; }
        throw e;
      }
    }
  },
  async readBlob(path) {
    const res = await this.req('GET', path, { ref: true, raw: true });
    if (!res.ok) throw await this.error(res);
    return res.blob();
  },
  async remove(path, message) {
    const res = await this.req('GET', path, { ref: true });
    if (!res.ok) return;
    const meta = await res.json();
    await this.req('DELETE', path, { body: { message, sha: meta.sha, branch: cfg.branch } });
  },
};

/*  State and sync                                                     */
/* ------------------------------------------------------------------ */
const state = { data: null, remote: null, view: 'day', dayId: null, queue: [], flushing: false, lastPull: 0, loadError: '', sheets: [] };

function setSync(kind, text) { $('syncBtn').dataset.kind = kind; $('syncText').textContent = text; }
function cacheRemote() { if (state.remote && connected()) store.set(cacheKey(), JSON.stringify(state.remote)); }
function adoptRemote(data) {
  state.remote = normalize(data);
  const local = clone(state.remote);
  state.queue.forEach((job) => job.mutate(local));
  state.data = local;
  cacheRemote();
}

async function pull({ quiet = false } = {}) {
  if (!connected() || state.flushing || state.queue.length) return;
  if (!quiet) setSync('saving', '同步中…');
  try {
    const r = await GH.readJSON(cfg.path);
    if (!r) throw new Error(`repo 裡找不到 ${cfg.path}。`);
    const incoming = normalize(r.data);
    if (state.flushing || state.queue.length || !connected()) return;
    if (JSON.stringify(incoming) !== JSON.stringify(state.remote)) {
      const hadData = Boolean(state.remote);
      adoptRemote(incoming);
      state.loadError = '';
      render();
      if (hadData && incoming.updatedBy && incoming.updatedBy !== cfg.name) toast(`${incoming.updatedBy} 更新了行程`);
    }
    state.lastPull = Date.now();
    setSync('ok', '已同步');
  } catch (e) {
    if (!connected()) return;
    if (!state.data) { state.loadError = e.message; render(); }
    setSync(e.network ? 'pending' : 'error', e.network ? '離線中' : '同步失敗');
    if (!quiet) toast(e.message);
  }
}

function commit(mutate, message) {
  mutate(state.data);
  touch(state.data);
  render();
  state.queue.push({ mutate, message });
  return flush();
}

async function flush() {
  if (state.flushing || !state.queue.length || !connected()) return;
  state.flushing = true;
  try {
    while (state.queue.length) {
      setSync('saving', '儲存中…');
      await pushJob(state.queue[0]);
      state.queue.shift();
      adoptRemote(state.remote);
      render();
    }
    state.lastPull = Date.now();
    setSync('ok', '已儲存');
  } catch (e) {
    if (e.network) setSync('pending', `${state.queue.length} 項未儲存`);
    else { setSync('error', '儲存失敗'); toast(e.message); }
  } finally {
    state.flushing = false;
  }
}

async function pushJob(job) {
  for (let attempt = 0; attempt < 6; attempt++) {
    const r = await GH.readJSON(cfg.path);
    if (!r) throw new Error(`repo 裡找不到 ${cfg.path}。`);
    const data = normalize(r.data);
    job.mutate(data);
    touch(data);
    try {
      await GH.write(cfg.path, utf8ToB64(JSON.stringify(data, null, 2) + '\n'), job.message, r.sha);
      state.remote = data;
      return;
    } catch (e) {
      const conflict = e.status === 409 || (e.status === 422 && /sha/i.test(e.ghMessage || ''));
      if (!conflict) throw e;
      await sleep(300 + Math.random() * 500 * (attempt + 1));
    }
  }
  throw new Error('和另一個人的修改一直衝突，請稍後再按一次儲存。');
}

/* Tries the new settings; only keeps them if the itinerary loads. */
async function signIn(next) {
  const prev = cfg;
  cfg = Object.assign({}, cfg, next);
  try {
    const r = await GH.readJSON(cfg.path);
    if (!r) throw new Error(`已連上「${cfg.repo}」，但裡面沒有 ${cfg.path}。請先把 data.json 上傳到這個 repo。`);
    if (!normalize(r.data).days.length) throw new Error(`${cfg.path} 裡沒有任何天數，請確認上傳的是正確的檔案。`);
    saveCfg();
    state.queue = [];
    adoptRemote(r.data);
    state.loadError = '';
    state.lastPull = Date.now();
    setSync('ok', '已同步');
    render();
  } catch (e) {
    cfg = prev;
    throw e;
  }
}

function signOut() {
  store.del(cacheKey());
  cfg.token = '';
  saveCfg();
  Object.assign(state, { data: null, remote: null, queue: [], loadError: '', dayId: null, view: 'day' });
  blobUrls.forEach((u) => URL.revokeObjectURL(u));
  blobUrls.clear();
  state.sheets.slice().forEach((s) => s.close(true));
  render();
  window.scrollTo({ top: 0 });
}

/* ---- Travel between stops ----
   Place names are looked up once on OpenStreetMap (1 per second, as its rules ask)
   and cached on this device. Times are rough estimates from straight-line distance;
   the 路線 button opens Google Maps for real routes and timetables. */
const GEO_KEY = 'trip:geo';
const GEO_OFF_KEY = 'trip:geo-off';
const geoCache = (() => { try { return JSON.parse(store.get(GEO_KEY) || '{}'); } catch { return {}; } })();
const geoQueue = [];
let geoBusy = false, geoRenderTimer = null;
const geoEnabled = () => store.get(GEO_OFF_KEY) !== '1';
const geoKey = (loc) => String(loc || '').trim().toLowerCase();
/* Taiwanese Traditional characters that are written differently in Japanese place names. */
const JP_CHARS = { '溫': '温', '龜': '亀', '縣': '県', '廳': '庁', '驛': '駅', '內': '内', '濱': '浜', '澤': '沢', '櫻': '桜', '國': '国', '鐵': '鉄', '廣': '広', '樂': '楽', '關': '関', '圖': '図', '區': '区', '邊': '辺', '當': '当', '燈': '灯', '萬': '万', '豐': '豊', '壽': '寿', '靜': '静', '寫': '写', '實': '実', '歲': '歳', '藝': '芸', '瀨': '瀬', '戶': '戸', '彌': '弥', '會': '会', '總': '総', '禮': '礼', '齋': '斎', '步': '歩', '峽': '峡', '臺': '台', '灣': '湾', '棧': '桟', '學': '学', '變': '変', '亞': '亜', '德': '徳', '惠': '恵', '從': '従', '惡': '悪', '瀧': '滝', '讚': '讃', '與': '与', '參': '参', '聲': '声', '賣': '売', '營': '営', '團': '団' };
const toJpChars = (t) => t.replace(/[\u4e00-\u9fff]/g, (c) => JP_CHARS[c] || c);

function coordsFromText(t) {
  const m = /@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/.exec(t) || /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(t)
    || /[?&](?:q|query|destination|ll|center)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i.exec(t) || /^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/.exec(t);
  return m ? { lat: +m[1], lng: +m[2] } : null;
}
/* Coordinates for a place, or null if unknown for now (a lookup may be queued). */
function geoOf(loc) {
  const text = String(loc || '').trim();
  if (!text) return null;
  const direct = coordsFromText(text);
  if (direct) return direct;
  if (isMapsLink(text) || !geoEnabled()) return null;
  const hit = geoCache[geoKey(text)];
  if (hit && hit.lat != null) return hit;
  if (!hit || (hit.none && Date.now() - hit.at > 3 * 86400000)) queueGeo(text);
  return null;
}
const geoWaiting = (loc) => geoQueue.includes(geoKey(loc));
function queueGeo(text) {
  const k = geoKey(text);
  if (geoQueue.includes(k) || !navigator.onLine) return;
  geoQueue.push(k);
  pumpGeo();
}
async function nominatim(q) {
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp,tw&accept-language=ja&q=' + encodeURIComponent(q);
  const res = await fetch(url, { referrerPolicy: 'strict-origin-when-cross-origin', headers: { Accept: 'application/json' } });
  if (res.status === 429 || res.status === 403) { const e = new Error('busy'); e.stop = true; throw e; }
  if (!res.ok) return null;
  const list = await res.json();
  return list && list[0] ? { lat: +list[0].lat, lng: +list[0].lon } : null;
}
async function pumpGeo() {
  if (geoBusy) return;
  geoBusy = true;
  while (geoQueue.length) {
    const k = geoQueue[0];
    try {
      let found = await nominatim(k);
      const alt = toJpChars(k);
      if (!found && alt !== k) { await sleep(1100); found = await nominatim(alt); }
      geoCache[k] = found || { none: true, at: Date.now() };
      store.set(GEO_KEY, JSON.stringify(geoCache));
      clearTimeout(geoRenderTimer);
      geoRenderTimer = setTimeout(() => { if ((state.view === 'day' || state.view === 'map') && connected() && !state.sheets.length) render(); }, 400);
    } catch {
      geoQueue.length = 0; // offline or rate-limited: try again next time the day is shown
      break;
    }
    geoQueue.shift();
    await sleep(1100);
  }
  geoBusy = false;
}
function kmBetween(a, b) {
  const rad = Math.PI / 180, dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
}
const toMin = (t) => (t ? +t.slice(0, 2) * 60 + +t.slice(3, 5) : null);
const distText = (km) => (km < 1 ? `${Math.round(km * 100) * 10} 公尺` : `${km < 10 ? km.toFixed(1) : Math.round(km)} 公里`);

/* A suggestion row between two stops. from/to: { label, loc, at?: 'HH:MM' } */
function hopEl(from, to, gapMin, quietFail = false) {
  if (!from.loc || !to.loc) return null;
  const same = geoKey(from.loc) === geoKey(to.loc);
  if (same) return null;
  const shortLink = (l) => isMapsLink(l) && !coordsFromText(l);
  if (shortLink(from.loc) || shortLink(to.loc)) return null;
  const a = geoOf(from.loc), b = geoOf(to.loc);
  const ask = (l) => { const c = coordsFromText(l); return c ? `${c.lat},${c.lng}` : l; };
  let mode = 'transit', lines, warn = null;

  if (a && b) {
    const km = kmBetween(a, b);
    if (km < 0.1) return null;
    const road = km * 1.3;
    let est = null;
    if (km <= 1.5) {
      est = Math.max(1, Math.round((road * 1000) / 70));
      mode = 'walking';
      lines = [h('b', null, `步行約 ${est} 分鐘`), `，距離約 ${distText(km)}`];
    } else if (km <= 40) {
      est = Math.round((road / 25) * 60 + 10);
      const taxi = Math.round((road / 30) * 60 + 3);
      lines = [h('b', null, `電車或巴士，粗估 ${est} 分鐘`), `，計程車約 ${taxi} 分鐘`];
    } else {
      lines = [h('b', null, `長途移動，約 ${distText(km)}`), '，火車、巴士或船，請查班次'];
    }
    if (gapMin != null && est != null && est > gapMin) {
      warn = gapMin <= 0 ? `上一個行程 ${from.end} 才結束，沒有留移動時間` : `只留了 ${gapMin} 分鐘移動，粗估要 ${est} 分鐘`;
    }
  } else if (!geoEnabled()) {
    lines = [h('b', null, '用 Google 地圖查路線')];
  } else if (geoWaiting(from.loc) || geoWaiting(to.loc)) {
    lines = [h('b', null, '估算移動時間中…')];
  } else if (quietFail) {
    lines = [h('b', null, '用 Google 地圖查路線')];
  } else {
    lines = [h('b', null, '用 Google 地圖查路線'), '（估不出時間，地點可以寫得更完整，例如加上車站或地址）'];
  }

  const url = legUrl(from.loc, to.loc, mode);
  return h('li', { class: 'hop', 'aria-label': `從 ${from.label} 到 ${to.label} 的交通建議` },
    h('div', { class: 't' }),
    h('div', { class: 'hop-body' },
      h('div', { class: 'hop-text' },
        h('span', { class: 'from' }, `從「${from.label}」過去`),
        h('span', null, lines),
        warn ? h('span', { class: 'hop-warn' }, warn) : null),
      h('a', { class: 'hop-go', href: url, target: '_blank', rel: 'noopener noreferrer' }, icon('route'), '路線')));
}

function hotelLoc(hotel) {
  if (!hotel) return '';
  if (hotel.location) return hotel.location;
  const withCoords = (hotel.links || []).find((l) => coordsFromText(l.url));
  return withCoords ? withCoords.url : hotel.name;
}

/* Timeline rows for a day, with travel suggestions between stops that have a place. */
function timelineRows(idx) {
  const days = state.data.days;
  const day = days[idx];
  const items = sortedItems(day);
  const rows = [];
  const lastNight = idx > 0 ? days[idx - 1].hotel : null;
  let prev = lastNight && lastNight.name ? { label: lastNight.name, loc: hotelLoc(lastNight), end: null, isHotel: true } : null;
  items.forEach((it) => {
    const pts = stopPoints(it);
    if (pts.entry) {
      if (prev) {
        const gap = prev.end && it.time ? toMin(it.time) - toMin(prev.end) : null;
        const hop = hopEl(prev, { label: it.title, loc: pts.entry }, gap, Boolean(prev.isHotel));
        if (hop) rows.push(hop);
      }
      prev = { label: it.title, loc: pts.exit, end: it.end || null };
    }
    rows.push(itemEl(it, costsOf(it.id)));
  });
  if (prev && !prev.isHotel && day.hotel.name) {
    const hop = hopEl(prev, { label: '飯店', loc: hotelLoc(day.hotel) }, null, true);
    if (hop) {
      hop.querySelector('.from').textContent = `從「${prev.label}」回飯店`;
      rows.push(hop);
    }
  }
  return rows;
}

/* Loads the PDF viewer only when someone opens a PDF. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsPromise = null;
function loadPdfJs() {
  if (!pdfjsPromise) {
    pdfjsPromise = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = PDFJS + 'pdf.min.js';
      sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; resolve(window.pdfjsLib); };
      sc.onerror = () => { pdfjsPromise = null; reject(new Error('無法載入 PDF 檢視器，請檢查網路。')); };
      document.head.append(sc);
    });
  }
  return pdfjsPromise;
}

/* Shrinks phone screenshots before upload while keeping text readable. */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const src = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, hgt = img.naturalHeight;
      const scale = Math.min(1, 1280 / w, 4200 / hgt);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * scale));
      c.height = Math.max(1, Math.round(hgt * scale));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error('無法處理這張圖片'))), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('無法讀取這張圖片，請改用 JPG 或 PNG。')); };
    img.src = src;
  });
}

      day.hotel.files.length ? h('div', { class: 'thumbs' }, day.hotel.files.map(thumbEl)) : null),
    hotelRoute ? h('div', { class: 'actions' }, h('a', { class: 'open', href: hotelRoute, target: '_blank', rel: 'noopener noreferrer', onclick: stopTap }, '路線')) : null);

  const items = sortedItems(day);
  const list = items.length
    ? h('ol', { class: 'timeline' }, timelineRows(idx))
    : h('div', { class: 'empty-day' }, '這天還沒有安排，按右下角「新增」加入第一個行程。');

  const homeTip = IS_IOS && !STANDALONE && !IN_APP && store.get('trip:home-tip') !== 'done'
    ? h('div', { class: 'notice' },
        h('p', null, '想從主畫面直接打開：按 Safari 的分享按鈕，選「加入主畫面」。第一次從主畫面打開時要再登入一次，貼上同一個邀請連結就可以。'),
        h('button', { class: 'btn small ghost', type: 'button', onclick: () => { store.set('trip:home-tip', 'done'); render(); } }, '知道了'))
    : null;
  main.replaceChildren(...[homeTip, sign, strip, stay, list].filter(Boolean));
  requestAnimationFrame(() => {
    const on = strip.querySelector('[aria-current=true]');
    if (on) strip.scrollLeft = on.offsetLeft - strip.clientWidth / 2 + on.clientWidth / 2;
  });
}

function notesEl(text) {
  const p = h('p', { class: 'notes' });
  const re = /https?:\/\/[^\s<>"'，。、）)]+/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) p.append(text.slice(last, m.index));
    const url = safeUrl(m[0]);
    p.append(url ? h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', onclick: (e) => e.stopPropagation() }, m[0]) : m[0]);
    last = m.index + m[0].length;
  }
  if (last < text.length) p.append(text.slice(last));
  return p;
}

function thumbEl(file) {
  const open = (e) => { e.stopPropagation(); openViewer(file); };
  if (!isImage(file)) return h('button', { class: 'thumb', type: 'button', 'aria-label': `開啟 ${file.name}`, onclick: open }, docTile(file));
  const img = h('img', { alt: file.name || '截圖', loading: 'lazy' });
  const btn = h('button', { class: 'thumb', type: 'button', 'aria-label': '查看圖片', onclick: open }, img);
  fileUrl(file).then((u) => { img.src = u; }).catch(() => btn.classList.add('broken'));
  return btn;
}

function luggageGroups(list, row) {
  const subs = [...luggageSubList(state.data.prep)];
  if (list.some((x) => !x.sub)) subs.push('');

  subs.forEach((sub) => {
    const items = list.filter((x) => x.sub === sub);

    out.push(h('div', { class: 'prep-sub' },

  });

function openLuggageSubsSheet() {
  if (!isAdmin()) return;
  const prep = state.data.prep;
  const current = luggageSubList(prep);
  const usedBy = (name) => prep.items.filter((x) => x.section === '行李' && x.sub === name).length;
  const err = h('p', { class: 'form-error', hidden: true });
  const list = h('div');
  const addRow = (orig) => {
    const nameInput = input(orig || '', 'text', { placeholder: '小分類名稱', 'aria-label': '小分類名稱' });
    const rowEl = h('div', { class: 'sub-row' }, nameInput,
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '往上移', onclick: () => { const prev = rowEl.previousElementSibling; if (prev) list.insertBefore(rowEl, prev); } }, '↑'),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '往下移', onclick: () => { const next = rowEl.nextElementSibling; if (next) list.insertBefore(next, rowEl); } }, '↓'),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '刪除', onclick: () => {
        const n = orig ? usedBy(orig) : 0;
        if (n && !confirm(`「${orig}」裡有 ${n} 個項目，刪除後會移到「未分類」。確定嗎？`)) return;
        rowEl.remove();
      } }, icon('close')));
    rowEl.dataset.orig = orig || '';
    list.append(rowEl);
    return nameInput;
  };
  current.forEach((name) => addRow(name));
  const rows = () => [...list.children].map((r) => ({ orig: r.dataset.orig, name: r.querySelector('input').value.trim() }));
  const initial = JSON.stringify(rows());

  const sheet = openSheet('行李小分類', h('div', null,
      err, list,
      h('button', { class: 'textbtn', type: 'button', onclick: () => addRow('').focus() }, '＋ 新增小分類')),
    [h('button', { class: 'btn ghost', type: 'button', onclick: () => sheet.close() }, '取消'),
     h('button', { class: 'btn primary', type: 'button', onclick: () => {
       const fail = (m) => { err.textContent = m; err.hidden = false; };
       const all = rows().filter((r) => r.orig || r.name);
       if (all.some((r) => r.orig && !r.name)) return fail('名稱不能空白；不要的話請按 ✕ 刪除。');
       const names = all.map((r) => r.name);
       if (new Set(names).size !== names.length) return fail('小分類名稱不能重複。');
       const renames = Object.fromEntries(all.filter((r) => r.orig && r.orig !== r.name).map((r) => [r.orig, r.name]));
       const removed = current.filter((name) => !all.some((r) => r.orig === name));
       sheet.close(true);
       commit(M.setLuggageSubs(names, renames, removed), `${who()}：更新行李小分類`);
     } }, '儲存')],
    { guard: () => JSON.stringify(rows()) === initial || confirm('還沒儲存，確定要關閉嗎？') });
}

/* ---- Map tab: the itinerary's places on an interactive map ---- */
const LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
let leafletPromise = null;
function loadLeaflet() {
  if (!leafletPromise) {
    leafletPromise = new Promise((resolve, reject) => {
      document.head.append(h('link', { rel: 'stylesheet', href: LEAFLET + 'leaflet.css' }));
      const sc = document.createElement('script');
      sc.src = LEAFLET + 'leaflet.js';
      sc.onload = () => resolve(window.L);
      sc.onerror = () => { leafletPromise = null; reject(new Error('地圖載入失敗，請檢查網路。')); };
      document.head.append(sc);
    });
  }
  return leafletPromise;
}
const mapUI = { el: null, map: null, layer: null, markers: new Map(), fitKey: '', pick: false };

/* The places of one day in visiting order: last night's hotel, each stop (and a transport stop's arrival), tonight's hotel. */
function dayPlaces(dayIdx) {
  const days = state.data.days, day = days[dayIdx], out = [];
  const lastNight = dayIdx > 0 ? days[dayIdx - 1].hotel : null;
  if (lastNight && lastNight.name) out.push({ key: `h${dayIdx}a`, kind: 'hotel', label: lastNight.name, sub: '昨晚住宿', loc: hotelLoc(lastNight), dayIdx });
  let n = 0;
  sortedItems(day).forEach((it) => {
    const pts = stopPoints(it);
    if (!pts.entry) return;
    n += 1;
    out.push({ key: `i${it.id}`, kind: 'stop', n, it, label: it.title, sub: `${it.time ? it.time + '　' : ''}${placeLabel(pts.entry)}`, loc: pts.entry, dayIdx });
    if (pts.both) out.push({ key: `i${it.id}b`, kind: 'arrival', n, it, label: it.title, sub: `抵達 ${placeLabel(it.locationTo)}`, loc: it.locationTo, dayIdx });
  });
  if (day.hotel.name) {
    const same = lastNight && lastNight.name === day.hotel.name;
    out.push({ key: `h${dayIdx}b`, kind: 'hotel', label: day.hotel.name, sub: '今晚住宿', loc: hotelLoc(day.hotel), dayIdx, hidden: same });
  }
  out.forEach((p) => { p.ll = geoOf(p.loc); });
  return out;
}

function popupEl(p) {
  const route = p.kind === 'arrival' ? legUrl(p.it.location, p.it.locationTo) : routeUrl(p.loc);
  return h('div', { class: 'popup' },

    h('small', null, `${state.mapAll ? dayName(p.dayIdx) + '　' : ''}${p.sub}`),
    h('div', { class: 'row' },
      h('a', { class: 'btn small ghost', href: placeUrl(p.loc), target: '_blank', rel: 'noopener noreferrer' }, 'Google 地圖'),
      route ? h('a', { class: 'btn small primary', href: route, target: '_blank', rel: 'noopener noreferrer' }, '路線') : null),
    p.it ? h('button', { class: 'textbtn', type: 'button', onclick: () => openEditor(p.it.id) }, '編輯行程') : null);
}

function drawTripMap(L, places, fitKey) {
  if (!mapUI.map) {
    mapUI.map = L.map(mapUI.el, { zoomControl: true }).setView([36.2, 138.25], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(mapUI.map);
    mapUI.map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
    mapUI.layer = L.layerGroup().addTo(mapUI.map);
    mapUI.map.on('click', (e) => {
      if (!mapUI.pick) return;
      setPickMode(false);
      const dayIdx = currentIndex();
      openEditor(null, { dayId: state.data.days[dayIdx].id, location: `${e.latlng.lat.toFixed(5)},${e.latlng.lng.toFixed(5)}` });
    });
  }
  const map = mapUI.map;
  map.invalidateSize();
  mapUI.layer.clearLayers();
  mapUI.markers.clear();

  const located = places.filter((p) => p.ll);
  let prev = null;
  located.forEach((p) => {
    const latlng = [p.ll.lat, p.ll.lng];
    if (prev && prev.dayIdx === p.dayIdx) {
      const leg = p.kind === 'arrival';
      L.polyline([[prev.ll.lat, prev.ll.lng], latlng], { color: leg ? '#1F4E7A' : '#7F909C', weight: leg ? 4 : 3, opacity: 0.85, dashArray: leg ? null : '6 8' }).addTo(mapUI.layer);
    }
    prev = p;
    if (p.hidden) return;
    const label = p.kind === 'hotel' ? '宿' : state.mapAll ? String(p.dayIdx + 1) : String(p.n);
    const cls = p.kind === 'hotel' ? 'hotel' : state.mapAll ? 'day' : `t-${p.it.type}${p.kind === 'arrival' ? ' arrival' : ''}`;
    const marker = L.marker(latlng, {
      icon: L.divIcon({ className: 'pin-wrap', html: `<span class="pin ${cls}">${label}</span>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14] }),
      title: p.label, riseOnHover: true, zIndexOffset: p.kind === 'hotel' ? -100 : 0,
    }).addTo(mapUI.layer);
    marker.bindPopup(popupEl(p));
    mapUI.markers.set(p.key, marker);
  });

  const key = `${fitKey}:${located.length}`;
  if (mapUI.fitKey !== key) {
    mapUI.fitKey = key;
    if (located.length === 1) map.setView([located[0].ll.lat, located[0].ll.lng], 15);
    else if (located.length > 1) map.fitBounds(L.latLngBounds(located.map((p) => [p.ll.lat, p.ll.lng])), { padding: [36, 36], maxZoom: 16 });
  }
  const waiting = places.some((p) => !p.ll && p.loc && geoWaiting(p.loc));
  const note = mapUI.el.querySelector('.map-note');
  const text = mapUI.pick ? '點地圖上的位置，新增一個行程。'
    : waiting ? '正在找地點的位置…'
    : !places.length ? '這天的行程還沒有填地點。' : !located.length ? '找不到這些地點的位置，可以把地點寫得更完整。' : '';
  if (text) { if (note) note.textContent = text; else mapUI.el.append(h('div', { class: 'map-note' }, text)); }
  else if (note) note.remove();
}

function renderTodos() {
  const kinds = [
    { status: 'needed', title: '待處理', btn: '完成', log: '已完成', cls: '' },
    { status: 'confirm', title: '待確認', btn: '確認了', log: '已確認', cls: ' confirm' },
  ];
  const row = (day, it, kind, isDone) => h('div', { class: 'todo-row' + (isDone ? ' done' : kind.cls), role: 'button', tabindex: '0', onclick: () => openEditor(it.id),
      onkeydown: (e) => { if (e.key === 'Enter') openEditor(it.id); } },
    h('div', { class: 'txt' },
      h('div', { class: 'item-title' }, it.title),
      h('div', { class: 'sub' }, `${md(day.date)}（${wd(day.date)}）${it.time ? ' ' + it.time : ''}`, isDone ? h('span', { class: 'tag' }, kind.log) : null)),
    isDone ? null : h('button', { class: 'btn small primary', type: 'button', onclick: (e) => {
      e.stopPropagation();
      commit(M.setBooking(it.id, 'done', who(), new Date().toISOString()), `${who()}：「${it.title}」${kind.log}`);
    } }, kind.btn));

  const parts = [];
  let open = 0;
  const done = [];
  kinds.forEach((kind) => {
    const groups = [];
    state.data.days.forEach((day, i) => {
      const items = sortedItems(day);
      const list = items.filter((it) => it.booking === kind.status);
      if (list.length) groups.push({ day, i, list });
      items.filter((it) => it.booking === 'done' && it.doneFrom === kind.status).forEach((it) => done.push({ day, it, kind }));
    });
    const count = groups.reduce((n, g) => n + g.list.length, 0);
    open += count;
    if (!count) return;
    parts.push(h('h2', { class: 'todo-section' }, kind.title, h('span', { class: 'count' + kind.cls }, count)));
    groups.forEach((g) => {
      parts.push(h('div', { class: 'todo-day' }, `${dayName(g.i)} ${md(g.day.date)}（${wd(g.day.date)}）${g.day.area}`));
      g.list.forEach((it) => parts.push(row(g.day, it, kind, false)));
    });
  });

  main.replaceChildren(...[
    open ? null : h('div', { class: 'empty-day' }, done.length ? '待辦都完成了。' : '把行程的「狀態」設成「待處理」或「待確認」，就會出現在這裡。'),
    ...parts,
    done.length ? h('h2', { class: 'todo-section' }, '已完成') : null,
    ...done.map(({ day, it, kind }) => row(day, it, kind, true)),
  ].filter(Boolean));
}

/*  Sheets, viewer, toast                                              */

function openSheet(title, body, foot = [], { guard } = {}) {
  const prevFocus = document.activeElement;
  const closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': '關閉' }, icon('close'));
  const panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'sheet-head' }, h('h2', { class: 'sheet-title' }, title), closeBtn),
    h('div', { class: 'sheet-body' }, body),
    foot.length ? h('div', { class: 'sheet-foot' }, foot) : null);
  const backdrop = h('div', { class: 'backdrop' }, panel);
  const api = {
    close(force) {
      if (!force && guard && !guard()) return;
      backdrop.remove();
      state.sheets = state.sheets.filter((s) => s !== api);
      if (!state.sheets.length) document.body.classList.remove('locked');
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
    },
  };
  closeBtn.addEventListener('click', () => api.close());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) api.close(); });
  state.sheets.push(api);
  document.body.classList.add('locked');
  document.body.append(backdrop);
  const first = panel.querySelector('.sheet-body input, .sheet-body textarea');
  if (first && window.matchMedia('(min-width: 700px)').matches) first.focus();
  return api;
}

function openViewer(file) {
  const dl = h('a', { download: file.name || 'file', hidden: true }, '下載');
  const content = h('div', { class: 'viewer-img' }, h('p', { class: 'viewer-note' }, '載入中…'));
  const wrap = h('div', { class: 'viewer', role: 'dialog', 'aria-modal': 'true', 'aria-label': file.name || '附件' },
    h('div', { class: 'viewer-bar' }, h('span', { class: 'name' }, file.name || '附件'), dl,
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': '關閉', onclick: () => api.close() }, icon('close'))),
    content);
  let closed = false;
  const api = { close() { closed = true; wrap.remove(); state.sheets = state.sheets.filter((s) => s !== api); if (!state.sheets.length) document.body.classList.remove('locked'); } };
  state.sheets.push(api);
  document.body.classList.add('locked');
  document.body.append(wrap);

  fileUrl(file).then(async (u) => {
    if (closed) return;
    dl.href = u; dl.hidden = false;
    if (isImage(file)) {
      content.replaceChildren(h('img', { src: u, alt: file.name || '圖片' }));
    } else if (isPdf(file)) {
      const pdfjs = await loadPdfJs();
      const doc = await pdfjs.getDocument({ data: await (await fetch(u)).arrayBuffer() }).promise;
      const pages = h('div', { class: 'pdf-pages' });
      content.replaceChildren(pages);
      const width = Math.min(content.clientWidth || window.innerWidth, 900);
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      for (let n = 1; n <= doc.numPages && !closed; n++) {
        const page = await doc.getPage(n);
        const viewport = page.getViewport({ scale: (width / page.getViewport({ scale: 1 }).width) * ratio });
        const canvas = h('canvas', { width: Math.floor(viewport.width), height: Math.floor(viewport.height), 'aria-label': `第 ${n} 頁` });
        canvas.style.width = `${Math.floor(viewport.width / ratio)}px`;
        pages.append(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
    } else {
      content.replaceChildren(h('div', { class: 'viewer-note' }, h('b', null, fileLabel(file)), `${file.name}${file.size ? `（${sizeText(file.size)}）` : ''}`,
        h('p', null, '這種檔案沒辦法在這裡預覽，按右上角「下載」打開。')));
    }
  }).catch((e) => { if (!closed) content.replaceChildren(h('p', { class: 'viewer-note' }, '無法開啟：' + e.message)); });
}

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3200);
}

function field(label, control, hint) {
  return h('div', { class: 'field' }, h('label', { class: 'label' }, label), control, hint ? h('span', { class: 'hint' }, hint) : null);
}
function input(value, type = 'text', extra = {}) { return h('input', Object.assign({ class: 'input', type, value: value || '' }, extra)); }
function seg(options, value, onChange) {
  const buttons = options.map((o) => h('button', { type: 'button', 'aria-pressed': String(o.id === value), onclick: () => {
    buttons.forEach((b, i) => b.setAttribute('aria-pressed', String(options[i].id === o.id)));
    onChange(o.id);
  } }, o.label));
  return h('div', { class: 'seg', role: 'group' }, buttons);
}

/* Attachment field used by the itinerary editor and the expense editor. */
function attachmentPicker(initial, showError) {
  const keep = [...initial], removed = [], pending = [];
  const box = h('div', { class: 'files' });
  const picker = h('input', { type: 'file', multiple: true });
  const addTile = h('label', { class: 'add-file' }, icon('image'), '加入附件', picker);
  const removeBtn = (onclick) => h('button', { class: 'x', type: 'button', 'aria-label': '移除附件', onclick }, icon('close'));
  const draw = () => {
    box.replaceChildren(
      ...keep.map((f) => {
        let face = docTile(f);
        if (isImage(f)) { face = h('img', { alt: f.name || '圖片' }); fileUrl(f).then((u) => { face.src = u; }).catch(() => {}); }
        return h('div', { class: 'file-tile', title: f.name },
          h('button', { class: 'tile-open', type: 'button', 'aria-label': `開啟 ${f.name || '附件'}`, onclick: () => openViewer(f) }, face),
          removeBtn(() => { keep.splice(keep.indexOf(f), 1); removed.push(f); draw(); }));
      }),
      ...pending.map((p) => h('div', { class: 'file-tile new', title: p.file.name },
        p.preview ? h('img', { src: p.preview, alt: p.file.name }) : docTile({ name: p.file.name, type: p.file.type }),
        removeBtn(() => { if (p.preview) URL.revokeObjectURL(p.preview); pending.splice(pending.indexOf(p), 1); draw(); }))),
      addTile);
  };
  picker.addEventListener('change', () => {
    const tooBig = [];
    [...picker.files].forEach((file) => {
      if (file.size > MAX_FILE_BYTES) { tooBig.push(file.name); return; }
      pending.push({ file, preview: isImage({ name: file.name, type: file.type }) ? URL.createObjectURL(file) : '' });
    });
    picker.value = '';
    if (tooBig.length) showError(`${tooBig.join('、')} 超過 20 MB，請改放到 Google 雲端硬碟，再貼上連結。`);
    draw();
  });
  draw();
  return {
    el: box,
    removed,
    signature: () => `${keep.map((f) => f.path).join(',')}|${pending.length}`,
    hasPending: () => pending.length > 0,
    /* Uploads new files and returns the full list. Files that already went up stay put if a later one fails. */
    async upload(folder, label, onProgress) {
      const uploaded = [];
      try {
        for (let i = 0; i < pending.length; i++) {
          onProgress(i + 1, pending.length);
          const file = pending[i].file;
          let blob = file, ext = extOf(file.name) || 'bin', type = file.type || 'application/octet-stream';
          if (isImage({ name: file.name, type: file.type }) && !/gif/i.test(type)) {
            try { blob = await compressImage(file); ext = 'jpg'; type = 'image/jpeg'; } catch { blob = file; }
          }
          const path = `attachments/${folder}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}.${ext.replace(/[^a-z0-9]/g, '') || 'bin'}`;
          await GH.writeNew(path, bytesToB64(new Uint8Array(await blob.arrayBuffer())), `${who()}：上傳「${label}」的附件`);
          blobUrls.set(path, URL.createObjectURL(blob));
          uploaded.push({ path, name: file.name, type, size: blob.size });
        }
      } catch (err) {
        uploaded.forEach((u) => { keep.push(u); const p = pending.shift(); if (p && p.preview) URL.revokeObjectURL(p.preview); });
        draw();
        throw err;
      }
      pending.splice(0).forEach((p) => { if (p.preview) URL.revokeObjectURL(p.preview); });
      keep.push(...uploaded);
      return [...keep];
    },
  };
}

/* Cost lines inside the itinerary editor: amount, who paid, and (folded away) how to split. */
function costRows(sp, existing) {
  const rows = [];
  const list = h('div', { class: 'cost-list' });
  const people = sp.people.map((p) => ({ id: p.id, label: p.name }));
  const add = (exp) => {
    const row = {
      exp, removed: false,
      cur: exp ? exp.currency : 'JPY',
      payer: exp && sp.people.some((p) => p.id === exp.paidBy) ? exp.paidBy : meId(sp),
      shares: Object.fromEntries(sp.people.map((p) => [p.id, exp ? exp.shares[p.id] || 0 : 1])),
    };
    row.amount = input(exp ? String(exp.amount) : '', 'text', { inputmode: 'decimal', placeholder: '金額', autocomplete: 'off', 'aria-label': '金額' });
    const summary = h('summary', null);
    const steppers = peopleSteppers(sp, row.shares, () => update());
    const update = () => {
      const total = parseAmount(row.amount.value);
      const sum = Object.values(row.shares).reduce((a, n) => a + n, 0);
      sp.people.forEach((p) => {
        const n = row.shares[p.id] || 0;
        steppers.amounts.get(p.id).textContent = total && sum && n ? money((total * n) / sum, row.cur) : '—';
      });
      summary.textContent = `怎麼分：${shareText({ shares: row.shares }, sp)}`;
    };
    row.amount.addEventListener('input', update);
    row.el = h('div', { class: 'cost-box' },
      h('div', { class: 'field' }, h('div', { class: 'amount-row' }, row.amount,
        seg([{ id: 'JPY', label: '日圓' }, { id: 'TWD', label: '台幣' }], row.cur, (v) => { row.cur = v; update(); }))),
      h('div', { class: 'field' }, h('span', { class: 'label' }, '誰付的'), seg(people, row.payer, (v) => { row.payer = v; })),
      h('details', { class: 'advanced' }, summary, steppers.el,
        h('div', { class: 'loc-tools' },
          h('button', { class: 'textbtn', type: 'button', onclick: () => { sp.people.forEach((p) => { row.shares[p.id] = 1; }); steppers.redraw(); update(); } }, '大家平分'),
          h('button', { class: 'textbtn', type: 'button', onclick: () => { sp.people.forEach((p) => { row.shares[p.id] = p.id === row.payer ? 1 : 0; }); steppers.redraw(); update(); } }, '只算付錢的人'))),
      h('button', { class: 'textbtn', type: 'button', onclick: () => {
        row.removed = true;
        row.el.remove();
        if (!rows.some((r) => !r.removed)) add(null);
      } }, '移除這筆'));
    update();
    rows.push(row);
    list.append(row.el);
  };
  existing.forEach(add);
  if (!existing.length) add(null);
  return {
    el: h('div', null, list, h('button', { class: 'textbtn', type: 'button', onclick: () => add(null) }, '＋ 再加一筆花費')),
    signature: () => JSON.stringify(rows.map((r) => [r.removed, r.amount.value, r.cur, r.payer, r.shares])),
    validate() {
      for (const r of rows) {
        if (r.removed || !r.amount.value.trim()) continue;
        if (!parseAmount(r.amount.value)) return '花費金額看不懂，請只填數字。';
        if (!r.payer) return '請選這筆花費是誰付的。';
        if (!Object.values(r.shares).some((n) => n > 0)) return '花費至少要有一個人分攤。';
      }
      return null;
    },
    changes({ itemId, dayId, type, now }) {
      const upserts = [], deletes = [];
      rows.forEach((r) => {
        const value = parseAmount(r.amount.value);
        if (r.removed || !value) { if (r.exp) deletes.push(r.exp.id); return; }
        const shares = Object.fromEntries(Object.entries(r.shares).filter(([, n]) => n > 0));
        const next = Object.assign({}, r.exp || { id: uid(), kind: 'expense', title: '', note: '', files: [], createdAt: now, category: TYPE_TO_CAT[type] || 'other' },
          { amount: value, currency: r.cur, paidBy: r.payer, shares, dayId, itemId, updatedBy: who(), updatedAt: now });
        const key = (e) => JSON.stringify([e.amount, e.currency, e.paidBy, Object.entries(e.shares).sort(), e.dayId]);
        if (!r.exp || key(r.exp) !== key(next)) upserts.push(next);
      });
      return { upserts, deletes };
    },
  };
}

function openEditor(itemId, preset = null) {
  const found = itemId ? findItem(state.data, itemId) : null;
